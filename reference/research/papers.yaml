  abstract: This article presents a new optimization method for complex power distribution
    networks (PDNs) with irregular shapes and multilayer structures using deep reinforcement
    learning (DRL), which has not been considered before. A fast boundary integration method
    is applied to compute the impedance matrix of a PDN structure. Subsequently, a new DRL
    algorithm based on proximal policy optimization (PPO) is proposed to optimize the decoupling
    capacitor (decap) placement by minimizing the number of decaps while satisfying the desired
    target impedance. In the proposed approach, the PDN structure information is encoded into
    matrices and serves as the input of the DRL algorithm, which increases the flexibility
    of the method to be extended and generalized to different PDN configurations. Also, the
    output of the algorithm determines the selection of decap types and locations collaboratively,
    making it easier to find the optimal solution in a huge search space. The proposed method
    is compared with the state-of-the-art approaches and shows consistent advantages in reducing
    the number of decaps in different testing cases.
