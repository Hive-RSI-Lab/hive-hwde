  abstract: "Gallium nitride high electron mobility transistors (GaN HEMTs) are promising\
    \ switching devices in high-efficiency and high-density dc\u2013dc converters due to their\
    \ fast switching speed and small conduction resistance. However, GaN HEMTs are very sensitive\
    \ to parasitic inductance because of their high switching speed, low-threshold voltage,\
    \ and small driving safety margin. Parasitic inductance can cause severe voltage overshoot\
    \ and ringing, which may result in electromagnetic interference issues, false turn-on,\
    \ or even device breakdown. This paper aims at reducing the parasitic inductance (including\
