  abstract: Transient voltage suppressor (TVS) has been widely used on the printed circuit
    board (PCB) to protect the microelectronics system against the system-level electrostatic
    discharge (ESD) and electrical fast transient/burst (EFT/B) events. However, the signal
    integrity of the system operations may be destroyed after the system-level ESD and EFT/B
    immunity test, if the TVS were designed with a holding voltage of lower than the operating
    voltage of the CMOS ICs equipped in the system. In this work, the signal integrity of
    microelectronics system protected by the TVS with different holding voltages was studied
    under the system-level ESD and EFT/B immunity test. By monitoring the transient voltage
    waveforms in the time domain during system-level ESD and EFT/B immunity test, the system
    malfunction has been found when the TVS is with a lower holding voltage. Therefore, the
    holding voltage of the TVS must be greater than the system operating voltage to maintain
    the signal integrity in the field applications.
