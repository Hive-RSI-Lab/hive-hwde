    power amplifier for marine biological sound reproduction. Due to the capacitive nature
    of underwater transducers and step-up transformers, output LC filter design is constrained,
    making it difficult to achieve a flat frequency response and low total harmonic distortion
    (THD). To address this, the electrical characteristics of these components were measured
