    market with 600 V devices getting commercialized and manufacturers coming up with different
    variants of normally-off devices to completely exploit the wondrous properties of this
    novel material.The growing acceptability of these devices has seen a strong interest in
    cascode structures.However, there is a lack of understanding of the issues caused by these
    nearly ideal devices when used in real circuits.Therefore, this paper is aimed at investigating
    the influence of parasitic inductances and capacitances that causes unexpected behavior
