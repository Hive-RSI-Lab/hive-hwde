  abstract: "Power delivery to a modern FPGA can demand 50 A at 0.85 V with transient di/dt\
    \ exceeding 100 A/\xB5s numbers that make every picohenry of loop inductance a voltage-droop\
    \ source. This research analysed the power integrity of embedded thin-film decoupling\
    \ capacitor arrays fabricated within the HDI substrate of an FPGA-based digital signal\
    \ processing module, comparing them against conventional surface-mount ceramic capacitors.\
    \ Twelve four-layer HDI test boards were fabricated: six with a 4 \xD7 4 array of embedded\
    \ 10 nF barium-titanate capacitors and six with an equivalent capacitance of surface-mount\
    \ 0201 MLCCs. Power distribution network impedance was measured from 100 kHz to 3 GHz\
    \ using a two-port shunt-through method on a VNA. The embedded array reduced PDN impedance\
    \ below the 0.50 m\u03A9 target from 80 MHz to 1.2 GHz, while the MLCC-only design exceeded\
    \ the target above 620 MHz due to mounting inductance. Transient voltage droop under a\
    \ 50 A step load was 38 mV for the embedded design versus 67 mV for the MLCC design, a\
    \ 43% improvement."
  topics:
  - decoupling-pdn
