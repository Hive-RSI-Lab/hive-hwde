    in high-frequency resonant converters. In a resonant tank, MLCCs experience complex electrical
    operating conditions (e.g., large-signal, high-frequency, DC bias), but the incurred power
    loss has not been clearly characterized and modeled. This paper first proposes a novel
    resonant-Sawyer-Tower (Res-ST) circuit which can experimentally extracts the loss of a
    MLCC in real operation in a resonant tank. A general loss modeling approach named Steinmetz's
