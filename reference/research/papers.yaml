# The research ledger (scripts/papers.py, docs/research/README.md).
#
# One entry per work hwde has seen, so a scan never brings it back:
#   status   candidate (found, not triaged) | kept (hwde wants something from
#            it: say what under `why`) | dropped (why not, under `why`)
#   access   open (copies: legitimate open copies, best first) | paywalled
#            (on the person's list, docs/research/paywalled.md) |
#            person_supplied (the person gave hwde a copy) | unknown
#   trust    retracted, peer_reviewed, source_type, cited_by: how far to lean
#            on the paper BEFORE hwde checks it. No claim is trusted on them.
#   claims   <paper id>/<n>: the claim, `where` (page/section/figure/eq read
#            from), `read_from` (full_text | abstract), and hwde's verdict:
#              untested       `plan`: the test, script or sim that would check it
#              reproduced / partial / refuted
#                             `evidence`: tests/<file>.py::<test> (its source
#                             names the claim id) or a script/sim file that
#                             does; `finding`: what the check showed
#              not_checkable  `why`
#            `guideline` only on reproduced or partial: what a designer
#            should do, in the scope hwde checked. docs/research/guidelines.md
#            is built from these.
# papers.py lint holds every one of these; tests/test_papers.py runs it.
