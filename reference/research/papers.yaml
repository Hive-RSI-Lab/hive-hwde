  abstract: Abstract The impedance characteristics of Power Distribution Networks (PDN) at
    the circuit level have always been critical in high-speed circuit design. However, to
    address power integrity issues caused by the reduction in chip feature sizes and the rapid
    increase in integrated circuit transistors counts, it is necessary to suppress power noise
    and meet the PDN impedance requirements of target device. This paper first analyzes the
    impedance characteristics of key device units, such as decoupling capacitors, and their
    PDN circuit models through modeling and simulation. It investigates optimization methods
    for anti-resonance spike and implements a multi-layer decoupling optimization strategy
    based on circuit parameters. Building on this, an impedance optimization strategy is proposed,
    combining coarse-grained computation based on target impedance parameters with fine-tuning
    to suppress anti-resonance spike. By leveraging the multi-stage cascading characteristics
    of decoupling capacitors and their typical parasitic parameters, circuit parameters and
    affected frequency ranges that meet the target impedance requirements are calculated.
    This allows for rapid determination of matching com
