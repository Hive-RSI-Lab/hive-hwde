    through the reflow soldering process. These movements may lead to common assembly defects
    such as overhanging, tilting, nonwetting, and tombstoning. Components to be assembled
    in surface mount assembly have self-alignment nature, which is driven by the total internal
    energy including gravitational energy, surface tension energy, etc. in the molten solder
    attributed to various factors. The factors include 1) solder paste composition, surface
