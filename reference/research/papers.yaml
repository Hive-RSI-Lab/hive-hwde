  claims:
  - id: impedance-analysis-optimization-research-power-2025/1
    read_from: full_text
    where: Section 2.2, Fig. 3
    claim: A 47 uF capacitor with 0.2 nH ESL and 0.1 mOhm ESR resonates at 1.64 MHz, where
      |Z| is its ESR.
    verdict: reproduced
    evidence: tests/test_research_claims.py::test_pdn_single_capacitor_series_resonance
    finding: check_pdn_z's branch model puts the minimum at 1.64 MHz (within 1 %) and |Z|
      = ESR there.
  - id: impedance-analysis-optimization-research-power-2025/2
    read_from: full_text
    where: Section 2.4, eq. 5 and the text after it
    claim: Two parallel capacitors anti-resonate at f1 = 1/(2 pi sqrt(Lb Cp)) with |Z| = sqrt(Lb/Cp)
      there.
    verdict: partial
    evidence: tests/test_research_claims.py::test_pdn_antiresonance_frequency_holds_magnitude_does_not
    finding: 'The peak sits at 1/(2 pi sqrt((Lb+Lp) Cp)): f1 holds only while Lp << Lb (19
      % off at Lp = Lb/2). Its height is X^2/(Rb+Rp), here 2.7x sqrt(Lb/Cp), not sqrt(Lb/Cp).'
    guideline: Place a bulk/MLCC anti-resonance at 1/(2 pi sqrt((L_bulk + L_mlcc) C_mlcc))
      and size its peak as X^2/(ESR_bulk + ESR_mlcc), X the bulk branch's reactance there;
      sqrt(L/C) underestimates the peak by the circuit's Q.
  - id: impedance-analysis-optimization-research-power-2025/3
    read_from: full_text
    where: Section 2.4 (3), Fig. 9
    claim: A higher-ESR (lower-Q) decoupling capacitor lowers the anti-resonance spike.
    verdict: partial
    evidence: tests/test_research_claims.py::test_pdn_lower_q_lowers_antiresonance
    finding: True until the two branches' ESR add up to about sqrt((Lb+Lp)/Cp); past that
      the spike is gone and more ESR raises |Z| over the whole band.
    guideline: 'Damp an anti-resonance with ESR up to about sqrt((L_bulk + L_mlcc)/C_mlcc)
      in total, not more: past it the ESR itself sets |Z|.'
  - id: impedance-analysis-optimization-research-power-2025/4
    read_from: full_text
    where: Section 2.4 (1), Fig. 8
    claim: n identical capacitors in parallel keep the resonance frequency and lower |Z| by
