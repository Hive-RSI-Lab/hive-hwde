  abstract: 'This paper presents a power distribution network (PDN) decoupling capacitor optimization
    application with three primary goals: reduction of solution times for large networks,
    development of flexible network scoring routines, and a concentration strictly on achieving
    the best network performance. Example optimizations are performed using broadband models
    of a printed circuit board (PCB), a chip-package, on-die networks, and candidate capacitors.
    A novel worst-case time-domain optimization technique is presented as an alternative to
    the traditional frequency-domain approach. The trade-offs and criteria for scoring the
    computed network are presented. The output is a recommended set of capacitors which can
    then be applied to the product design.'
