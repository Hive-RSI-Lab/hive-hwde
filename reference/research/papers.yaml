  abstract: For power delivery applications, a method for reducing impedance is through the
    addition of decoupling capacitors (decaps). In this article, we propose a knowledge-based
    optimization method to determine decap design in power delivery networks (PDNs). The proposed
    method provides the optimized PDN with the minimum number of decaps by iteratively assigning
    the decaps that maximize the frequency range where the target impedance is satisfied.
