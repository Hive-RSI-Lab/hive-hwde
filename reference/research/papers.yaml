  abstract: "High performance power electronics design requires a firm characterization of\
    \ active and passive components. This work presents a framework for quantifying passive\
    \ component performance by reviewing both existing methods and robust device figures-of-merit.\
    \ A comprehensive survey yields aggregated data for nearly 700,000 commercial capacitors\
    \ and inductors of all types. To supplement deficiencies in this data, this work proposes\
    \ and validates several empirical expressions to estimate passive component energy storage\
    \ and mass. Estimation of volumetric mass density per component type allows the approximation\
    \ of component mass from accessible box volume. Estimation of energy-equivalent capacitance\
    \ in nonlinear Class II ceramic capacitors facilitates the evaluation of stored energy\
    \ and related energy density figures-of-merit. A phenomenological analysis of the comprehensive\
    \ component data produces several conclusory determinations about peak energy density\
    \ capabilities\u2014with respect to volume, mass, and cost\u2014across capacitor and inductor\
    \ technologies."
