# The research topics hwde follows (scripts/papers.py, docs/research/README.md).
#
# Each topic is a few literature queries run against OpenAlex (which indexes
# journals, conferences and arXiv), the EE area it serves (the EE map's area
# name), the hwde tools its findings would sharpen, how often it is due, and
# the earliest publication date worth reading. `papers.py scan --due --add`
# runs the due ones and stamps last_scanned; a topic with no hits worth
# keeping still gets stamped, so the loop moves on.
#
# Add a topic when a design, a review or an ingestion run finds a question
# hwde answers from folklore; drop one that keeps returning nothing kept.
topics:
- id: decoupling-pdn
  area: power-integrity
  tools:
  - check_decoupling
  - check_pdn_z
  - check_pdn
  queries:
  - PCB power distribution network decoupling capacitor anti-resonance
  - target impedance PDN decoupling capacitor selection
  since: '2015-01-01'
  every_days: 30
  last_scanned: '2026-10-30'
- id: mlcc-derating
  area: passives
  tools:
  - mlcc_dcbias
  - check_ratings
  queries:
  - MLCC DC bias capacitance loss class II dielectric
  - multilayer ceramic capacitor aging DC bias X7R X5R measurement
  since: '2012-01-01'
  every_days: 60
  last_scanned: '2026-10-30'
- id: trace-current-thermal
