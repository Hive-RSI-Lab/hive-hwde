envelope:
  vcm_v: {min: 0, max: 5}
maturity: approved
generalizes: []
envelope_note: >-
  The rule keys on where the screen sits relative to the input common-mode
  potential, so the dim is that potential. Bounded 0 V to 5 V because the
  witnessed discussion is explicitly a 5 V single-supply sensor front end
  (with the +-2.5 V dual-supply case as its contrast): that is the regime
  in which "0 V is the lower rail" and "mid supply is the common-mode
  voltage" are the two candidate nodes. On a higher-voltage or
  differently-referenced front end the same mechanism holds but the node
  choice is a different question, and the vendor gives no number for it.
verification: {by: "second-reader", date: "2026-08-16", note: "Renesas white paper p.6 Active Shield Guard Drive re-read: every quoted clause is verbatim - shielded cables reject coupling BUT cable impedance mismatch can result in a common mode error into the amplifier; driving the cable shield to a low impedance potential reduces the impedance mismatch; the shield is usually tied to chassis ground as an excellent low impedance point, which 'works great for dual supply applications'; with single supply (5V) tying the shield at 0V is the amplifier's lower power supply rail, 'which is typically a common mode voltage where the same CMR performance degrades'; 'Tying the shield at common mode voltage of mid supply results in the operation of the amplifier with the best CMR performance'. Figure 5 above it is indeed a FOIL STRAIN GAUGE bridge of 350 ohm legs on +5 V into a single-supply INA and a 24-bit ADC - this slot's operating point, so not a transplant. p.7 verbatim: 'Driving the shield to the input common mode voltage reduces cable impedance mismatch and improves CMR performance in single supply sensor applications', with the unused on-chip op amp offered as the buffer. Figure 6 zoomed and read as a drawing: SHIELDED CABLE +SIG/-SIG to INA-/INA+, screen landed AT THE AMPLIFIER END on the COMMON MODE DRIVER - VA+/VA- through 10k and 10k to a VCM SENSE node into A4's IN+ with OUT fed back to IN- (unity gain), then 100 ohm in series to the screen. Exactly as the record draws it. AD8226 Table 3 CMRR condition VCM = 0 V to 1.7 V, 86 dB min at G=1 - confirmed, so the record is right to quote the degrades-at-0V argument as the other vendor's (its parts are RRIO per that paper's own conclusion) rather than adopt it. THE ADMISSION IS REALLY IN THE RECORD: rule.not_witnessed_here states that only the driven case's end is witnessed and that passive-screen near/far and both-ends current injection are NOT witnessed, and the prose repeats 'The near/far end question this record does not answer.' Nothing in the record quietly asserts either. No scope violation - it never says a screen or any protection is unnecessary, only which node it should land on. Envelope 0-5 V matches the witnessed +5 V single supply vs +-2.5 V dual contrast. Minor: the parenthetical purpose given for the 100 ohm (isolation from cable capacitance) is the author's reading, not vendor text."}
