verification: {by: "second-reader", date: "2026-08-16", note: "Re-read Infineon p29 (Figure 20 and its two notes) and p31 (Figure 23 and its notes), plus ST p31 PA13/PA14 rows. Figure 20's assignment matches the record cell for cell (1 VTref, 2 SWDIO/TMS, 3 GND, 4 SWCLK/TCK, 5 GND, 6 (SWO)/TDO, 7 (KEY) GND, 8 NC/TDI, 9 (GNDDetect) GND, 10 nRESET; 4 of 10 positions GND) and note 2 is verbatim. The prose does label the i -> (n+1)-i reversal geometry a DERIVATION that no cited source states, and it does NOT assert a reversed plug is safe: it says safety turns on the probe's rail pin being a sense input, which no cited page states - correct, Figure 23 note 2 only sets a supply-level contract, nothing about the pin's direction or impedance. Figure 23 does show VTref out of the I/O power domain to pin 1 with C7 = 100 nF. Two caveats, neither fatal: 'shrouded' is the record's word (Infineon note 1 says only a 10-way connector with 1.27-mm pitch, e.g. FTSH-105-01-L-DV-K), and the return-path class rests on an observation (4 of 10 GND, and SWDIO's nearest GND is diagonal, not beside it) rather than a rule - at level principle it cannot close the checklist's return-path row in any case."}
