  date: '2026-10-04'
  note: >-
    Second read 2026-10-04 against 2168367 p22 (printed p21) and p6 (Table 3). Held: both
    quoted paragraphs, the gain-pin switch/jumper sentence and all eight CMRR numbers (86/90
    at G=1, 106, 120, 120; 80, 90, 90, 100 at 5 kHz). Edits: the rule.ad8226_cmrr_* values
    and the prose now carry the Table 3 conditions (minimum, +Vs = 2.7 V single supply, VCM
    0 to 1.7 V); the 'a 350 ohm bridge is far more forgiving' claim in envelope_note replaced
    by an author-reasoning label.
