envelope:
  f_signal_hz:
    max: 5000
maturity: verified
generalizes: []
envelope_note: >-
  The rule scales with FREQUENCY: the error is a common-mode to differential conversion produced
  by mismatched time constants, so it vanishes at DC and grows as the band approaches the
  pole made by a path's resistance and its stray capacitance. The bound is the highest frequency
  at which the cited part specifies CMRR at all (5 kHz, Table 3) - above it there is no vendor
  number for the copper to preserve. It also scales with source resistance, since the mismatched
  pole is R*C (author reasoning, not on p22).
verification:
