id: resistive-attenuator-ratio-from-relative-specs
classes: [selection]
applies:
  topologies: [resistive-attenuator]
  packages: []
  interfaces: []
  parts: []
rule:
  enforced_by: null
  ratio_error_set_by: relative specs (tolerance matching, TCR tracking)
  absolute_tolerance_sets: absolute value, not ratio
  common_mode_error: cancels in the ratio
prose: >
  A divider's ratio error is set by the RELATIVE specs of its elements -
  tolerance matching and TCR tracking - not by their absolute tolerance or
  absolute TCR. Vishay builds the same V = 10 network twice. Discretes (p1,
  fig 1): TCR +/-25 ppm/K, tolerance +/-0.1 %. Array (p2, fig 3): the SAME
  absolute TCR +/-25 ppm/K but absolute tolerance +/-0.25 %, two and a half
  times WORSE, plus relative TCR tracking 10 ppm/K and tolerance matching
  0.1 %. Figs 2 and 4 plot overall gain error against lifetime on the same
  0-0.7 % axis: the discrete build reaches about 0.65 % at 90 000 h, the array
  stays under 0.3 %. The part with the worse absolute tolerance is the better
  divider. Fig 6 (p3) draws the mechanism: four elements R1..R4 may sit
  anywhere inside a +/-0.25 % absolute band while lying within +/-0.05 % of
  EACH OTHER - the offset they share cancels in the ratio and only the spread
  survives. Buy matching, not accuracy. For a discrete string the same logic
  holds in reverse: anything common to every element (a lot-wide trim offset,
  a uniform temperature) cancels and only element-to-element difference reaches
  the output - but discretes carry no MATCHING spec, so that difference is
  bounded only by the absolute tolerance, worst case twice it.
sources:
  - file: reference/knowledge/sources/incresarr.pdf
    page: 1
    section: "s1, s2.1, figs 1-2"
    note: >
      Read: fig 1 schematic (non-inverting amp, R2 feedback / R1 to ground) and
      the discrete spec block TCR +/-25 ppm/K, tolerance +/-0.1 %; fig 2 plots
      gain error (%) vs lifetime 0-90 000 h with separate tolerance, TCR and
      drift contributions and an overall gain error reaching about 0.65 %.
      Note 3 defines resistance layer temperature as ambient plus the electrical
      energy converted to heat.
  - file: reference/knowledge/sources/incresarr.pdf
    page: 2
    section: "s2.2, s3, figs 3-5"
    note: >
      Read: the array spec block (absolute TCR +/-25 ppm/K, absolute tolerance
      +/-0.25 %, relative TCR tracking 10 ppm/K, relative tolerance matching
      0.1 %); fig 3 boxes R1 and R2 as one array package; fig 4 is fig 2's plot
      on the same 0-0.7 % axis with every curve collapsed below 0.3 %. Text
      defines tolerance matching as "relative tolerance" or "ratio tolerance".
  - file: reference/knowledge/sources/incresarr.pdf
    page: 3
    section: "fig 6"
    note: >
      Read: fig 6 plots dR/R for four elements R1..R4 of one array. Red dashed
      lines mark the +/-0.25 % absolute tolerance band; a narrow blue band marks
      +/-0.05 % tolerance matching. The four points cluster together, offset
      from zero but inside the narrow band - the shared offset cancels in the
      ratio, the spread does not.
