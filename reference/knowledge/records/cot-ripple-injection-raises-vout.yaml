id: cot-ripple-injection-raises-vout
classes: [feedback]
applies:
  topologies: [buck]
  packages: []
  interfaces: []
rule:
  enforced_by: null
  applies_when: constant-on-time regulator with Type 3 (AC-coupled) ripple injection
  vout: (1 + R_top/R_bot) * (VREF + Vramp_pkpk/2)
  solve_against: union of [VREF_min, VREF_max + Vramp_max/2] - check both corners
  fb_overvoltage: compare against FB PEAK (VREF + full Vramp), not its average
prose: >
  A constant-on-time regulator ends its off-time when FB falls back through
  VREF, so it regulates the VALLEY of FB, not its average. With Type 3
  injection the ramp is AC-coupled into FB and its mean is genuinely zero, so
  FB_dc = VREF + Vramp/2 and VOUT = (1 + R_top/R_bot) x (VREF + Vramp_pkpk/2) -
  NOT VREF times the divider ratio. On an LM5017 at 78.6 mV of injected ripple
  that is +3.2 %: 5.06 V where a valley calculation says 4.90 V, which is
  enough to put a 5 V rail over a downstream driver's recommended VDD max. A P4
  reviewer computed the rail min/nom/max without the term and concluded the
  nominal was 100 mV low. Both readings matter in practice because Vramp
  carries Rr, Cr and K tolerance, so solve the divider against the UNION -
  effective reference in [VREF_min, VREF_max + Vramp_max/2] - and check both
  corners rather than picking one model. Also check the FB overvoltage
  comparator against FB's PEAK (VREF + full Vramp): the LM5017 trips at 1.62 V
  and terminates the on-time pulse.
sources:
  - {file: boards/rf-de-20m/LEARNINGS.md, section: 2026-08-08 Type 3 ripple injection RAISES the DC output}
  - {file: boards/rf-de-20m/parts/C34355.pdf, section: LM5017 (the part this was measured on)}
status: active
origin: promotion:boards/rf-de-20m (U6 2026-08-14)

# --- schema v2 governance (U14 backfill, owner-ruled 2026-08-15) ---
level: family
envelope:
  control_kind: {in: [cot]}
  injection_kind: {in: [type3]}
maturity: approved
approval:
  by: owner
  date: "2026-08-15"
  note: >
    Bounded by the control architecture: the +Vramp_pkpk/2 term exists only
    because a constant-on-time loop regulates the VALLEY of FB and Type 3
    injection AC-couples a zero-mean ramp onto it. A voltage-mode or
    current-mode part with the same divider lands on VREF exactly. No
    generalizes link: buck-bst-fb-output-caps is family-level too (the
    schema requires a strictly MORE general target), and this record's real
    parent - what a control loop senses and where in the ripple it trips -
    is a principle the library does not hold yet. Queued for research.
