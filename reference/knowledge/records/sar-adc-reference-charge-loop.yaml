id: sar-adc-reference-charge-loop
classes: [power-loop]
applies:
  topologies: [sar-adc]
  packages: []
  interfaces: []
  parts: []
rule:
  enforced_by: null
  loop: "bypass cap -> REF pin -> internal capacitor array -> GND/VREFLO pin -> back to the cap"
  minimize: "loop inductance - the bypass cap adjacent to the REF and GND pins, wide copper out and back"
  device_pin_cap: "a capacitor bridging the reference pin to its return AT the device pins (SPRABY5 fig 1-1's unlabeled C, section 1.4's Cbypass)"
  damped_shunt: "SPRABY5 puts a 0.1 ohm RREF in SERIES with CREF as a shunt branch from the reference node to ground, keeping the overall impedance low and constant at high frequency"
  isolation_resistor_is_a_different_element: "a large current-limiting resistor belongs between a high-impedance reference SOURCE and the capacitors, never between the bypass cap and the pin"
prose: >
  The reference bypass is a LOOP, not a component. Every bit decision pulls a
  fast current pulse out of the bypass capacitor and returns it to the
  converter's ground / VREFLO pin; that loop's inductance, not the
  capacitor's value, decides how far the reference sags and rings before the
  comparator latches. SPRABY5 p.2 states the rule: "the inductance between
  the reference capacitor and the REF pin is minimized by placing the
  capacitor close to the pin and connecting it with wide traces", plus a
  small 0.1 ohm series resistor (RREF) "to keep the overall impedance low and
  constant at high frequencies". Its own fig 1-1, traced at high
  magnification, shows a different arrangement than that sentence suggests:
  REF50xx Vout reaches VREFHI on ONE unbroken wide pour with no series
  element in the feed; RREF taps that pour and sits in series with CREF as a
  damped shunt to ground - RREF at the node end, CREF beyond it at the
  reference-IC end; the cap that actually bridges VREFHI to VREFLO at the
  device pins is one of the two unlabeled C's (the other is the REF50xx's
  TRIM/NR cap). At 0.1 ohm that resistor damps the cap-plus-inductance
  resonance; it isolates nothing. Isolation is a different element: ADS8326
  p.22 puts a current-limiting resistor between a high-impedance reference
  source and the capacitors - upstream of the bypass cap, never between cap
  and pin, where it would sit in the pulse path. p.26 corroborates the pulsed
  nature: little average current, real instantaneous demand.
sources:
  - file: reference/knowledge/sources/spraby5.pdf
    page: 2
    note: "1.3 Layout Guidelines: minimize the inductance between the reference capacitor and the REF pin by placing the capacitor close to the pin and connecting it with wide traces; a small 0.1 ohm series resistor RREF keeps the overall impedance low and constant at high frequencies"
  - file: reference/knowledge/sources/spraby5.pdf
    page: 3
    note: "Figure 1-1 Example Layout, traced at 14x: REF50xx Vout leaves on a wide pour that passes RREF's lower pad and continues unbroken (via one diagonal step) into VREFHI - no series element in the feed. RREF's upper pad runs up to CREF's right pad and CREF's left pad joins the wide diagonal ground pour, so RREF + CREF form a series-RC damped shunt to ground with RREF at the node end and CREF at the reference-IC end. Of the two unlabeled C's, the left one's top pad ties to TRIM/NR (a white gap separates it from the VREFHI band) and the right one bridges VREFHI to VREFLO at the device pins. The figure therefore disagrees with the p.2 sentence about the reference capacitor sitting close to the REF pin"
  - file: reference/knowledge/sources/ads8326.pdf
    page: 22
    note: "REFERENCE INPUT + fig 42: 47 uF low-ESR tantalum connected as close as possible to the REF pin, and 'if a high output impedance reference source is used, an additional operational amplifier with a current-limiting resistor must be placed in front of the capacitors' - i.e. the series resistor sits between source and cap, not between cap and pin"
  - file: reference/knowledge/sources/ads8326.pdf
    page: 26
    note: "LAYOUT: 'while the ADS8326 draws very little current from the reference on average, there are still instantaneous current demands placed on the external input and reference circuitry'; an op-amp-driven reference must remain stable driving the bypass capacitor, the series resistor helping"
status: active
