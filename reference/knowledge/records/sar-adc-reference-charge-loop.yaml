envelope:
  reference_kind: {in: [external]}
maturity: approved
generalizes: [sar-adc-acquisition-charge-transfer]
envelope_note: >
  The loop only exists when the per-bit charge pulse crosses board copper,
  i.e. reference_kind external; with the reference generated on-die there is
  no external loop to enclose and nothing to place. What the rule scales with
  is loop INDUCTANCE - cap-to-pin distance and the width of both the feed and
  the return - not the capacitance value, which is why the placement survives
  changes of cap value, dielectric and conversion rate while the topology
  stays the same.
verification: {by: "research-second-reader", date: "2026-08-16", note: "SETTLED FROM THE PIXELS. Rendered spraby5 p.3 fig 1-1 at 3x, 8x and 14x and traced every pour pad to pad. (a) REF50xx Vout leaves on a wide pour that runs unbroken past RREF's LOWER pad, takes one diagonal step down and lands on VREFHI - there is NO series element in the feed. (b) RREF's UPPER pad runs up a vertical band, then a diagonal up-left onto CREF's RIGHT pad; CREF's LEFT pad drops onto a vertical band that joins the wide pour forking out of the REF50xx GND pad (confirmed at 8x: the GND pour enters from the left, forks inside the body, one arm up-right to CREF's left pad, the other down-right to the bottom band that feeds VREFLO). So RREF + CREF ARE a series-RC damped shunt to ground, RREF at the node end, CREF at the reference-IC end. (c) The disputed point goes to the researcher, NOT the previous reader: at the VREFHI row the band from TRIM/NR runs right and DEAD-ENDS on the LEFT unlabeled C's top pad; a clear white gap follows; the RIGHT unlabeled C's top pad sits on the separate band that drops from the Vout pour and continues into VREFHI. Both C's bottom pads are on the VREFLO/ground band. So only the RIGHT C bridges VREFHI-VREFLO (= section 1.4's Cbypass, 'a capacitor Cbypass is used between VREFHI and VREFLO', verbatim p.3); the LEFT C is TRIM/NR to ground, the REF50xx's noise-reduction cap. Calling both of them Cbypass was wrong. (d) p.2 verbatim, including a prefix the record does not quote and which STRENGTHENS its self-inconsistency finding: 'In the below figure, the inductance between the reference capacitor and the REF pin is minimized by placing the capacitor close to the pin and connecting it with wide traces', after naming CREF as the decoupling cap; the below figure does not place CREF there. 0.1-ohm RREF verbatim. (e) ads8326 p.22 carries the isolation case verbatim - 'a 47uF tantalum capacitor with low ESR should be connected as close as possible to the input pin. If a high output impedance reference source is used, an additional operational amplifier with a current-limiting resistor must be placed in front of the capacitors' - and p.27 fig 44 draws exactly that order (REF3225 -> 10 ohm -> 2.2uF -> OPA350 -> 47uF -> REF, nothing between the 47uF and the pin). p.26 quote verbatim. Cannot refute. One nuance for the record, not a defect: the figure DOES place a cap at the pin (the unlabeled Cbypass), so what disagrees with p.2 is which capacitor carries the CREF label, not the design intent - the record's prose already says this."}
