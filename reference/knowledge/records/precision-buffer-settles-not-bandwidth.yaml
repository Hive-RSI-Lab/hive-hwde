maturity: approved
generalizes: []
verification: {by: "research-second-reader", date: "2026-08-16", note: "Re-read sprpeo2 p5, p6, p7, p8, p25, p26 and p27, sboa586a p25 and opa333 p7, re-ran the ppm scan myself and re-did the arithmetic. The ppm defect that refuted this record last pass is gone and the replacement is correct and correctly labelled. THE SCAN REPRODUCES EXACTLY. Case-insensitive search for the string ppm over every page of all four ledger PDFs: sprpeo2 0 hits in 54 pages, sboa586a 0 in 27, sboa418 0 in 14 - 95 pages, zero hits - and opa333 exactly 1 hit, on p24, the line 20-ppm/Degrees C Max, 100-uA, SOT23-3 Series Voltage Reference, REF3130, which is an advertisement for a different part and not a settling claim. The p25 source note states precisely that (The slide states no error in ppm - the string ppm appears nowhere in sprpeo2, sboa418 or sboa586a - so any ppm equivalence in this record is arithmetic on the sourced formula, not a vendor claim), so the record now discloses the provenance instead of implying a vendor number. THE ARITHMETIC IS RIGHT. ln(2^16) = 11.0904; exp(-11.0904) = 1.5259e-5 = 2^-16 = 15.26 ppm, i.e. 11.09 tau leaves exactly one 16-bit LSB, which is what rule.bw_min now says; 1/2 LSB = 2^-17 needs -ln(2^-17) = 11.7835 tau, the record's 11.8 in the rule and 11.78 in the note; and this block's 8 ppm target needs -ln(8e-6) = 11.7361 tau, the note's 11.74. The solve ln(1/err) for any other target instruction generalises it correctly. THE SOURCED FORMULA IS ON THE PAGE. sprpeo2 p25 reads For N-bit accuracy BW approximately ln(2^N)/(2*pi*t_settle), For 16-bit BW approximately 11/(2*pi*t_settle), Driver must settle to 16-bit accuracy to 1/2 LSB, Settling time < acquisition time + margin, For 5 MSPS with 70ns acquisition Required closed-loop BW approximately 25 MHz min, Added margin in consideration for signal BW and input RC filter, and the footnote simulating RC combo still recommended - so closed_form_is a floor is the slide's own hedge. EVERY OTHER CITATION RE-READ. p5 carries the SAR internal model with V_CSH(t) = V_CSH(t0) + [VIN - V_CSH(t0)]*(1 - exp(-t/tau)) and tau = R_SH*C_SH, the curve settling inside 1/2 LSB during t_AQ. p7 is exactly as described and this is the claim that most needed re-checking: the figure is a blue dashed box labelled ADC chip containing ONLY the S/H switch, R_SH, C_SH and a block marked ADC - no amplifier - the trace to its right is labelled C_SH voltage, dips at switch closure, recovers and is annotated settled within 1/2 LSB under a t_acq bracket, and the bullets above give the sample-hold capacitor needs to be settled to 1/2 LSB within the ADC acquisition time and t_acq = 1/f_smpl - t_conv_max. The word slew appears nowhere on that page, so the record's insistence that the recovery is the R_SH*C_SH exponential and not an amplifier moving is the page's own content. p8 reads If CSH is not settled to 1/2 LSB within tacq, the ADC sampled waveform will be distorted and attenuated, over an ADC Input Waveform and ADC Output Waveform pair - the record's gloss as gain and linearity error rather than noise is a fair reading of distorted and attenuated. p26 is the charge-bucket panel (main purpose handle the kickback current when a SAR ADC sampling switch closes, quickly charge, must be optimized for settling time). p27 gives practical t_FLT_settle = t_ACQ = 12*tau_FLT, R_FLT = t_ACQ/(12*C_FLT) and Minimum driver GBW > 4*(1/(2*pi*R_FLT*C_FLT)) word for word, which is rule.also_required. sboa586a p25 step 7 is verbatim and is the seventh and last step, so slew being a standalone screen rather than part of the acquisition waveform is the page's own ordering. opa333 p7 confirms SR 0.16 V/us at G = +1 and GBW 350 kHz at C_L = 100 pF. For a principle-level record with three records generalizing onto it I looked specifically for anything left unsourced in the rule block and found none: every field traces to p5, p7, p25, p26, p27 or sboa586a p25, and the one piece of arithmetic is now flagged as arithmetic. Verified."}
