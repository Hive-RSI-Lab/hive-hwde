verification: {by: "second-reader", date: "2026-08-16", note: "Re-read AD8226 PDF p.21 (printed p.20, INPUT VOLTAGE RANGE opening paragraph) and SLYT226 PDF p.1 (printed p.25). Both quotes verbatim: ADI 'Internal nodes between the first and second stages (Node 1 and Node 2 in Figure 58) experience a combination of a gained signal, a common-mode signal, and a diode drop. This combined signal can be limited by the voltage supplies even when the individual input and output signals are not limited'; TI 'Saturation causes the INA output voltage, although of wrong value, to appear normal to the following processing circuitry. This could lead to disastrous effects with unpredictable consequences.' TI Figure 1 is titled 'Classic three-op-amp INA and its voltage nodes' and does print V1 = VCM - G1(VD/2), V2 = VCM + G1(VD/2), G1 = 1 + 2RF/RG; the Equation 4 text confirms only VD/2 is amplified while VCM passes the input stage at unity gain. Level principle is right and nothing in the prose overreaches either page."}
