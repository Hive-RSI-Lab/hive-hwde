envelope:
  output_cap_kind: {in: [datasheet-defined]}
maturity: approved
generalizes: []
envelope_note: >
  Bounded by the kind of output capacitor the part demands, because that is what
  the rule is about: it holds for references whose datasheet DEFINES a stable
  capacitance range (every series part read here does, and both ends plus an ESR
  band are specified). It does not transfer to parts advertised as stable with
  any capacitance or with no output cap, nor to a shunt reference where the
  capacitor sits across a resistor-fed diode rather than inside an amplifier
  loop - there the cap is chosen for noise and transient response, not stability.
verification: {by: "second-reader", date: "2026-08-16", note: "Re-read for the cin_uf correction and the added p5 citation. ADI p3 LOAD CAPACITANCE is a two-ended window read off the word coordinates: 1 at x=436 under the Min header (x=436) and 100 at x=498 under Max (x=498), unit uF - so a 47 uF converter REF bypass sits inside the ADR4520's own stable range and this record forces no reference buffer. p31 is verbatim and the corrected cin_uf now matches it exactly: 'A 1 uF to 10 uF electrolytic or ceramic capacitor can be connected to the input... An additional 0.1 uF ceramic capacitor should be connected in parallel to reduce supply noise', alongside 'An output capacitor is required for stability and to filter out low level voltage noise', Table 12 Minimum COUT = 1.0 uF for ADR4520/ADR4525 versus 0.1 uF for ADR4530 through ADR4550, and the extra parallel 1-10 uF that improves transient response but increases turn-on time. The new p5 citation lands: the ADR4530 table gives LOAD CAPACITANCE 0.1 (Min, x=437) to 100 (Max, x=499) uF and its TURN-ON SETTLING TIME row is specified at CL = 0.1 uF, CIN = 0.1 uF, RL = 1 kohm (130 us), against p3's CL = 1 uF, CIN = 0.1 uF (90 us) - so the per-member split of Table 12 is confirmed from the electrical tables themselves, not only from the applications page. REF70 p25 Sec 9.4.1 is verbatim ('A 1-uF to 100-uF output capacitor (CL) must be connected from OUTF to GND. The equivalent series resistance (ESR) value of CL must be 1 mohm to 400 mohm to ensure output stability') and the 1-400 mohm ESR band is repeated as footnote (1) on p9. REF35 p22 is verbatim (CIN 0.1-10 uF, CL 0.1-10 uF from REF to GND, ESR lower than 400 mohm, higher capacitance meaning longer start-up). REF70 p32 start-up inrush to ISC is verbatim. Nothing left to refute here."}
