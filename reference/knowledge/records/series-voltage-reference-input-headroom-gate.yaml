envelope:
  vout_v: {max: 3.0}
maturity: approved
generalizes: []
envelope_note: >
  Scales with output voltage, because the elevated floor is a LOW-VOUT
  phenomenon and that is where the rule bites. The measured split is inside one
  family: 1 V of dropout at 2.048 V out, 500 mV at 2.5 V, but 100 mV (no load) /
  300 mV at 2 mA for every member at or above 3 V; TI applies its fixed 2.75 V
  floor only for VOUT < 2.5 V. At or above ~3 V out the minimum input is just
  VOUT plus a small, ordinary dropout, and the "the catalog range is not your
  number" warning stops being load-bearing.
verification: {by: "second-reader", date: "2026-08-16", note: "Fig 6 (ADI p11) re-read at 9x AND re-measured from the PDF vector paths against tick-calibrated axes: all three plotted curves carry 0.905 V data points from -10 mA through +6 mA, and past the break the -40 C trace stays at 0.905 V, the +25 C trace ends at 1.025 V and the +125 C trace ends at 1.360 V at +10 mA - below the 1.4 gridline. Both halves of the correction are exact and the earlier refutation is cured. The per-member dropout table was checked cell by cell on its own page, with the Min/Typ/Max header x-positions read per page because the columns shift: p3 ADR4520 (VOUT 2.048) = 1 V in Max for BOTH 'no load' and 'IL = 2 mA'; p4 ADR4525 (2.500) = 500 mV Max for both; p5 ADR4530 (3.000), p6 ADR4533 (3.300), p7 ADR4540 (4.096) and p8 ADR4550 (5.000) = 100 mV Max no load / 300 mV Max at 2 mA. The floor list is better supported than the record claims: 3.1 / 3.4 / 4.2 / 5.1 V are ADI's own per-page 'Unless otherwise noted, VIN = ...' table conditions rather than derived numbers, while p3 and p4 both state VIN = 3 V to 15 V - so 3.048 (2.048+1.0) and 3.0 (2.5+0.5) stand and where_the_flat_condition_binds holds. p1 carries 'Input voltage range: 3 V to 15 V' and 'Low dropout voltage: 300 mV at 2 mA (VOUT >= 3 V)' verbatim under a Rev. 0 / 2012 ADI masthead, and p29's VDO definition is verbatim. REF70 p6 footnote (1) and the p3 B-to-C revision lines are verbatim, and the new p9 citation lands: VDO 250 mV at IL = 5 mA and 400 mV at IL = 10 mA both sit in the MAX column (values at x=494, MAX header at x=490) over -40 to +125 C, with Fig 10-6 typicals measuring ~33-65 mV at 0 mA and ~137-208 mV at 10 mA. Board arithmetic re-derived from the pages: 3.135 - 3.048 = 87 mV. One wording flaw, not refuting: on p1 '(VOUT >= 3 V)' is an inline parenthetical inside the Features bullet, not a footnote, yet rule.family_attribute, the prose and the p1 note all call it footnoted while quoting it correctly."}
