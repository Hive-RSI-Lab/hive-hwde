verification: {by: "second-reader", date: "2026-08-16", note: "Re-read DS p41/p42/p44 + AN2519 p5 + AN13033 p15. p44 Table 21 VDDA row Conditions column reads verbatim: Must have a potential equal to or higher than VDD (2.4-3.6 V) - it is a General-operating-conditions CONDITION, not an absolute maximum and not a recommendation, exactly as the record types it. p44 Table 22 gives VDD and VDDA fall time rate min 20 us/V, rise min 0. p42 Table 18 gives VDD-VDDA max 0.4 V for VDD greater than VDDA, and note 1 that all main power and ground pins must always be connected to the external supply. p41 Fig 12 does label the block fed off VDDA as Analog: (RCs, PLL, ...) beside the ADC, while VDD feeds the regulator/VCORE and the IO level shifters - the load-bearing claim holds visually. AN2519 p5 ferrite DC-drop caution is quoted correctly and attributed to s2.1, not smuggled in as a VDDA statement. Principle with no envelope is right: no operating-point dim bounds a rail-ordering relation."}
