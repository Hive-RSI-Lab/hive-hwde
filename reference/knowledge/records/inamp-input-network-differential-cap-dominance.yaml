id: inamp-input-network-differential-cap-dominance
classes: [diff-pair]
applies:
  topologies: [inamp]
  packages: []
  interfaces: []
  parts: []
rule:
  enforced_by: null
  sizing_rule: "CD >= 10 * CC - the differential capacitor must dominate the two common-mode capacitors"
  why: "the two CC cannot be matched, and it is their MISMATCH that converts common mode to differential; a CD an order larger sets the differential response instead"
  f_diff_equation: "FilterFrequency_DIFF = 1 / (2*pi*R*(2*CD + CC))"
  f_cm_equation: "FilterFrequency_CM = 1 / (2*pi*R*CC)"
  fig63_r_ohm: 4020
  fig63_cc_nf: 1
  fig63_cd_nf: 10
  fig63_f_cm_khz_derived: 39.6
  fig63_f_diff_khz_derived: 1.89
  fig63_pole_ratio_derived: 21
  series_r_placement: "any series resistance in an input path belongs close to the in-amp input pins, which minimises its interaction with PCB trace parasitic capacitance"
  stray_case: "with no network fitted CD = 0 and CC is whatever each trace, pad and pin field presents to ground; nothing swamps the mismatch, so only geometric symmetry defends CMRR"
  derived_not_quoted: "the two pole frequencies and their 21x ratio are computed from the printed equations and the printed Figure 63 component values; ADI prints the equations and the values but not the resulting frequencies"
  scope: "device side - the connector, cable and shield half belongs to the input-interface slot"
prose: >
  An in-amp input network is deliberately ASYMMETRIC in its capacitors, and
  that asymmetry is the whole trick. ADI's Figure 63 (RFI Suppression) puts
  R = 4.02 kohm in each input leg, CC = 1 nF from each leg to ground, and
  CD = 10 nF bridging the two legs, with the printed relations
  FilterFrequency_DIFF = 1/(2*pi*R*(2*CD + CC)) and
  FilterFrequency_CM = 1/(2*pi*R*CC), where CD >= 10 CC. Those values put
  the common-mode pole at 39.6 kHz and the differential pole at 1.9 kHz,
  about 21x lower (derived). The reason is stated plainly: "Mismatch
  between the R x CC at the positive input and the R x CC at the negative
  input degrades the CMRR of the AD8226. By using a value of CD that is one
  magnitude larger than CC, the effect of the mismatch is reduced and
  performance is improved." Two ordinary-tolerance 1 nF parts cannot be
  matched; one CD ten times larger sets the differential response instead.
  Placement rides along: series R in an input path "should be placed close
  to the in-amp inputs, which minimizes their interaction with parasitic
  capacitance from the PCB traces".
  The STRAY case is the same law with CD = 0: nothing is fitted, CC is
  whatever each trace, pad and pin field presents to ground, and nothing
  swamps its mismatch - so only geometry defends CMRR: equal length,
  mirrored neighbours, equal clearance to ground copper on both layers.
  SCOPE: this board fits no input R/C network. That is a block-only scope
  exclusion for this run, NOT a finding that the network is unnecessary.
sources:
  - file: reference/knowledge/sources/2168367.pdf
    page: 23
    section: "AD8226 Rev. C, printed p.22 - RADIO FREQUENCY INTERFERENCE (RFI) and Figure 63"
    note: >
      Read the RFI section and Figure 63 "RFI Suppression" visually. The
      schematic draws a series R in each input leg labelled 4.02 kOhm, a
      CC = 1 nF from each leg to ground, and a CD = 10 nF bridging +IN to
      -IN across the two legs, with RG across the gain pins and 0.1 uF +
      10 uF on each supply rail. Printed with it: "The filter limits the
      input signal bandwidth according to the following relationship",
      FilterFrequency_DIFF = 1/(2*pi*R*(2*CD + CC)), FilterFrequency_CM =
      1/(2*pi*R*CC), "where CD >= 10 CC"; and the paragraph beside the
      figure: "CD affects the difference signal and CC affects the
      common-mode signal. Values of R and CC should be chosen to minimize
      RFI. Mismatch between the R x CC at the positive input and the R x CC
      at the negative input degrades the CMRR of the AD8226. By using a
      value of CD that is one magnitude larger than CC, the effect of the
      mismatch is reduced and performance is improved." Also read on the
      same page that RF rectification "can appear as a small dc offset
      voltage" - the reason the network exists at all.
  - file: reference/knowledge/sources/2168367.pdf
    page: 22
    section: "AD8226 Rev. C, printed p.21 - Common-Mode Rejection Ratio Over Frequency"
    note: >
      Read the two paragraphs that make this a LAYOUT rule and not only a
      filter-design rule: conversions of common mode to differential "occur
      when one input path has a frequency response that is different from
      the other", so "the input source impedance and capacitance of each
      path should be closely matched"; "Additional source resistance in the
      input path (for example, for input protection) should be placed close
      to the in-amp inputs, which minimizes their interaction with parasitic
      capacitance from the PCB traces"; and the second paragraph making
      parasitic capacitance at the gain-setting pins a part-selection
      constraint for any switch or jumper placed there.
status: active
