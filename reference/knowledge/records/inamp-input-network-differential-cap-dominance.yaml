level: principle
envelope: null
maturity: approved
generalizes: []
envelope_note: >
  No envelope, deliberately. CD >= 10 CC is a relation between two
  capacitors in one network. It does not scale with supply, gain,
  temperature, source resistance or frequency: change R, CC and CD together
  and the inequality still holds, because it is about which capacitor SETS
  the differential response, not about where the poles land. The pole
  frequencies do move with R and C, but they are outputs of the printed
  equations, not bounds on this rule. The stray corollary (CD = 0, symmetry
  the only defence) is the same relation at its limit.
verification: {by: "research-second-reader", date: "2026-08-16", note: "Re-read p.23 (printed 22) and p.22 (printed 21) in full. Printed p.22 RADIO FREQUENCY INTERFERENCE (RFI) carries both equations exactly as cited - FilterFrequency_DIFF = 1/(2*pi*R*(2*CD + CC)) and FilterFrequency_CM = 1/(2*pi*R*CC), 'where CD >= 10 CC' - and Figure 63 'RFI Suppression' draws R = 4.02 kOhm in each input leg, CC = 1 nF from each leg to ground, CD = 10 nF bridging +IN to -IN, RG across the gain pins and 0.1 uF + 10 uF on each rail, exactly as the citation note says. The paragraph beside the figure is quoted word for word ('Mismatch between the R x CC at the positive input and the R x CC at the negative input degrades the CMRR of the AD8226. By using a value of CD that is one magnitude larger than CC, the effect of the mismatch is reduced and performance is improved.'), and the same page carries the RF-rectification-as-small-dc-offset sentence. ARITHMETIC RECOMPUTED: f_CM = 1/(2*pi*4020*1e-9) = 39.59 kHz, f_DIFF = 1/(2*pi*4020*21e-9) = 1.885 kHz, ratio = (2CD+CC)/CC = 21.0 exactly - the record's 39.6 kHz / 1.89 kHz / 21x is right, and it is correctly flagged derived_not_quoted since ADI prints the equations and the values but not the frequencies. Printed p.21 carries both quoted layout sentences verbatim (conversions 'occur when one input path has a frequency response that is different from the other', 'the input source impedance and capacitance of each path should be closely matched', and additional series R 'should be placed close to the in-amp inputs, which minimizes their interaction with parasitic capacitance from the PCB traces') plus the gain-pin parasitic-capacitance paragraph. The CD = 0 corollary is ARGUED, not asserted: it is the printed f_DIFF equation at its limit, where f_DIFF collapses onto f_CM and nothing swamps the leg-to-leg CC mismatch, closed by the vendor's own instruction to match each path's capacitance. SCOPE GUARDRAIL PRESENT AND CORRECT: the prose states plainly that fitting no input R/C network is a block-only scope exclusion for this run and NOT a finding that the network is unnecessary. level principle with no envelope is right - CD >= 10 CC is a relation between two capacitors, independent of supply, gain and temperature. On the +/-15 V conditions caveat: this record cites no TPC figure and quotes no dB from the curves, so that caveat has nothing to attach to here; its absence is not a defect. One wording flag, not refuting: the opening 'deliberately ASYMMETRIC in its capacitors' means CD >> CC, not leg-to-leg asymmetry - the same sentence and the stray-case paragraph make that clear, but a tighter phrasing would remove the risk of a reader inverting it."}
