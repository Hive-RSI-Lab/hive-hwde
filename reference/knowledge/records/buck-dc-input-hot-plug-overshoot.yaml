envelope:
  source_kind: {in: [dc-input]}
maturity: approved
generalizes: []
envelope_note: >
  Scales with what the SOURCE does at connect. A dc-input source (bench
  supply or adapter on leads) hands the board an unmanaged voltage step
  into whatever C_IN was fitted, so the binding number is the LC ring
  against the part's abs-max VIN, and it bites harder the closer the
  nominal input sits to that maximum. A USB/PD/PoE port instead specifies
  the allowed bulk capacitance and ramps its own rail - the already-held
  rule. The ring needs a STEP: a supply that ramps slowly with the board
  already connected does not excite it, so this is a hot-plug / fast-start
  bound, not a steady-state one.
verification: {by: "second-reader", date: "2026-08-15", note: "Verified from the pages, independent of the earlier pass. sluaal8 p3 annotations re-read at high magnification and all three match the record: Fig 2-2 Ri = 0.21 ohm / Li = 9.3 uH with Ci = 20 and 40 uF; Fig 2-3 Ri = 0.15 ohm / Ci = 40 uF sweeping Li = 5 and 12 uH (blue is the 5 uH trace - it peaks first, 0.42 ms vs 0.68 ms, and its amplitude matches the 5 uH case); Fig 2-4 Li = 9.3 uH / Ci = 40 uF sweeping Ri = 0.15 and 0.5 ohm. I calibrated each curve against its own printed gridlines and measured stroke centrelines instead of eyeballing: 20 uF 29.65 V at 0.42 ms, 40 uF 27.19 V at 0.64 ms, Li 5 uH 27.26 V settled by ~2.5 ms, Li 12 uH 30.28 V still swinging 18.4-19.4 V over 4.5-5 ms, Fig 2-4 0.15 ohm 36.09 V then flat 33.47 V from 2.5 ms, 0.5 ohm 29.81 V with its last swing at 4.34 ms. Every quoted value sits within 0.35 V of the centreline and inside a half stroke-width of the printed curve, so the one-decimal quotes are defensible off this page (33.5 is exact to 0.03 V). Settling tails measure 18.08-18.36 V, so Vi ~18.3 V holds; the 1.5-1.6x band measures 1.49x and 1.62x on Fig 2-2 and is independently corroborated at 1.49x and 1.65x on Fig 2-3, which the record does not even claim. Damping arithmetic is exact: 2*sqrt(9.3 uH / C) = 1.929 / 1.364 / 0.964 ohm at 10 / 20 / 40 uF, and 9.3 uH is printed on p3. p2 Eq 3 is transcribed verbatim, its Rt = 0 reduction to Vi*(1-cos wt) with a 2x peak is algebraically right, and the three p2 text claims are faithful. p4 Eq 4, its reasoning and Fig 3-1 (2 ohm 0.5 W 1210 anti-surge + 2.2 uF 25 V 1210 + 0.1 uF 50 V 0805) all check, including TI own may-need-adjusting caveat. lmr33630 p6 confirms 38 V abs max / 36 V rec max / 3.8 V min / IOUT 0-3 A; p32 confirms every clause including the 20-100 uF aluminium or tantalum remedy, its ESR damping and load-step hold, the snap-back thyristor TVS refusal with the collapse-below-Vout reason, and the input-filter instability warning. The 30 V extrapolation is legitimate rather than an overreach: Eq 3 is linear in Vi, so the overshoot RATIO is Vi-independent by the source own printed model; 1.49-1.62x onto 30 V gives 44.8-48.7 V, the record 45-49 V, well under the source own zero-R ceiling of 2*Vi = 60 V that the record also cites, and destroy-the-part is backed by p6 footnote 1 (permanent damage). Cross-check the author did not run: zeta = (R/2)*sqrt(C/L) at Vi = 18.3 V predicts 29.5/27.4 V for Fig 2-2 and 27.6/30.2 V for Fig 2-3, matching the drawn curves to 0.2 V, so the two figures the rule actually rests on are physically self-consistent and the Fig 2-3 trace assignment is confirmed. Fig 2-4 handling passes: the anomaly is recorded as drawn with an explicit do-not-read-ring-duration caveat and no number in rule comes off that figure. Two cautions for a later pass, not grounds to refute: (1) the p3 note opening claim that every trace starts at 0 V is false for the Fig 2-4 0.15 ohm trace, which is drawn from 17.7 V at t = 0.05 ms and never goes below 17.71 V - the note corrects the settles-to-18.3 half of that sentence but not this half; (2) the Fig 2-4 anomaly is wider than stated - by the model the 0.5 ohm trace should peak at 21.0 V but is drawn at 29.81 V, above Fig 2-2 same-L same-C but LOWER-R 0.21 ohm case at 27.19 V, so cross-figure the drawn data runs opposite to the peak-versus-Ri trend the note takes from that page; the conclusion still stands on the p2 text and Eq 3 / Eq 4, but the warrant is weaker than represented."}
