id: buck-dc-input-hot-plug-overshoot
classes: [inrush]
applies:
  topologies: [buck]
  packages: []
  interfaces: []
  parts: []
rule:
  enforced_by: null
  binding_limit: "hot-plug LC overshoot at the VIN pin, NOT an upstream bulk-capacitance budget"
  damping_criterion: "R_lead + R_cap > 2*sqrt(L_lead/C_in) - for TI's 9.3 uH cable that is 1.9 ohm at 10 uF C_IN, 1.4 ohm at 20 uF, 0.96 ohm at 40 uF"
  undamped_peak: "the printed model with zero series R reduces to Vi*(1-cos wt) - a 2x peak"
  plotted_peaks: "about 30 V (C_IN 20 uF) and 27 V (40 uF) from an ~18.3 V source at Ri = 0.21 ohm, Li = 9.3 uH - 1.5-1.6x Vi"
  headroom_at_this_op: "30 V nominal against a 38 V abs-max VIN pin = 1.27x; scaling TI's 1.5-1.6x ring onto 30 V gives 45-49 V, over the abs max"
  fixes: "shorten the leads; 20-100 uF aluminium or tantalum across the ceramics; or an RC snubber (2 ohm 0.5 W + 2.2 uF class)"
  tvs: "allowed, but never a snap-back (thyristor) type on a regulator input"
prose: >
  A bench supply or DC adapter imposes no bulk-capacitance budget the way
  USB, PD or PoE do - that is buck-upstream-inrush-limit's case. What
  bounds a dc-input board is the hot-plug transient: lead resistance and
  inductance in series with a low-ESR ceramic C_IN form an under-damped
  series LC that a live plug-in steps. With no series resistance the
  printed model reduces to Vi*(1-cos wt), a 2x peak; TI's plots at
  Ri = 0.21 ohm, Li = 9.3 uH peak at ~30 V (C_IN 20 uF) and ~27 V (40 uF)
  on an ~18.3 V source - 1.5-1.6x Vi. More capacitance damps the peak
  without removing it, more lead inductance raises it and rings longer,
  and only series resistance suppresses the ring (raising Ri drops the
  peak ~36 -> ~30 V; ring duration runs the other way on that plot - see
  the p3 note). The criterion R_lead + R_cap > 2*sqrt(L_lead/C_in) wants
  1.9 ohm at 10 uF C_IN, 0.96 ohm at 40 uF, for that 9.3 uH cable; real
  cable is 0.15-0.21 ohm and the pin capacitor cannot carry much series R
  - short by 5-10x, so every plotted trace rings. Scaled onto this
  board's 30 V input that is 45-49 V at VIN against a 38 V abs max - a
  destroy-the-part event. Fixes, in the part's own words:
  shorten the leads and add a 20-100 uF aluminium or tantalum across the
  ceramics - its ESR damps the resonance and holds VIN up through load
  steps; an RC snubber sized by the criterion is cheaper. A TVS is
  allowed, but never a snap-back type: when it fires it collapses below
  Vout and the output caps discharge back through it.
sources:
  - file: reference/knowledge/sources/lmr33630.pdf
    page: 32
    section: "Power Supply Recommendations"
    note: >
      With long wires or traces the parasitic inductance of the input
      cables in combination with low-ESR ceramic input capacitors forms an
      under-damped resonant circuit, producing overvoltage transients at
      the regulator input, while the parasitic resistance dips VIN on load
      transients (which can trip a reset near minimum input). Remedy
      stated: reduce the distance from supply to regulator and/or an
      aluminium or tantalum capacitor in parallel with the ceramics, 20 uF
      to 100 uF. Also: snap-back (thyristor) TVS explicitly not
      recommended, because when it fires the clamp falls below Vout and
      the output capacitors discharge back through it; and an input filter
      in front of the regulator can cause instability.
  - file: reference/knowledge/sources/lmr33630.pdf
    page: 6
    section: "7.1 Absolute Maximum Ratings / 7.3 Recommended Operating Conditions"
    note: >
      VIN to PGND absolute maximum 38 V (recommended operating maximum
      36 V, minimum 3.8 V; IOUT 0-3 A). This is the ceiling the hot-plug
      ring is measured against for a 30 V input.
  - file: reference/knowledge/sources/sluaal8.pdf
    page: 2
    section: "2 Root Cause, Figure 2-1, Equations 1-3"
    note: >
      Figure 2-1 models adapter insertion as source Vi behind cable Ri/Li
      into the pin capacitance Ci with series Rc. Equation 3 gives
      VCi(t) = Vi - Vi*exp(-Rt*t/2Li)*((Rt/2wLi)*sin wt + cos wt), which
      at Rt = 0 is Vi*(1-cos wt) - peak 2*Vi. Text: higher Ci damps but
      does not eliminate the spike, longer leads (higher Li) give higher
      spikes and longer ringing, and only adding series resistance
      suppresses the ringing.
  - file: reference/knowledge/sources/sluaal8.pdf
    page: 3
    section: "Figures 2-2, 2-3, 2-4"
    note: >
      Three plots of VCi from the p2 model (not scope captures); every
      trace starts at 0 V and settles to Vi = ~18.3 V. Fig 2-2 is
      annotated Ri = 0.21 ohm, Li = 9.3 uH: Ci = 20 uF peaks ~30 V at
      0.42 ms, Ci = 40 uF peaks ~27 V at 0.6 ms, both rung out by ~3.5 ms
      - so 1.5-1.6x Vi, and more Ci lowers the peak without removing it.
      Fig 2-3 is annotated Ri = 0.15 ohm, Ci = 40 uF and sweeps Li: 5 uH
      peaks ~27.5 V and settles by ~3 ms, 12 uH peaks ~30.5 V and is still
      ringing at 5 ms - higher Li, higher peak, longer ring. Fig 2-4 is
      annotated Li = 9.3 uH, Ci = 40 uF and sweeps Ri: 0.15 ohm peaks
      ~36 V, 0.5 ohm peaks ~30 V, so raising Ri lowers the peak. But as
      drawn the ring duration runs the other way - the 0.5 ohm trace is
      the one that rings, to ~4 ms, settling ~18.3 V, while the 0.15 ohm
      trace flat-lines at ~33.5 V, which contradicts Fig 2-2's 0.21 ohm /
      40 uF case settling at 18.3 V. Take the peak-versus-Ri trend from
      this page and the ring-suppression claim from the p2 text; do not
      read ring duration off Fig 2-4. The only inductances printed on the
      page are 9.3 uH, 5 uH and 12 uH.
  - file: reference/knowledge/sources/sluaal8.pdf
    page: 4
    section: "3 RC Snubber, Equation 4, Figure 3-1"
    note: >
      Equation 4 gives the damping condition Ri + Rc > 2*sqrt(Li/Ci).
      Since cable inductance varies and the IC pin capacitance cannot
      carry much series resistance, the recommended fix is a separate
      snubbing branch: Figure 3-1 shows 2 ohm (0.5 W, 1210, anti-surge) in
      series with 2.2 uF (25 V, 1210) to ground, plus a 0.1 uF 50 V 0805
      kept very close to the supply pin. The filter may sit at the
      connector or nearer the IC when long traces and GND returns are
      used, and TI notes the RC combination can need adjusting for some
      applications.
status: active
