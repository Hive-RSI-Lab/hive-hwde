verification: {by: "second-reader", date: "2026-08-16", note: "Post-verification edit re-read, and all five cited pages re-read this pass. The added SLVA115A p3 holds exactly: p3 carries the window as numbers (The curve of this device requires that, for the minimum 2.2-uF of output capacitance, the ESR must be between 0.1 ohm and 20 ohm), the worked fZ(ESR) = 1/(2 pi RESR COUT) = 72.3 kHz with RESR 0.1 ohm and COUT 2.2 uF, the stable ESR-times-C product band, the sentence Few capacitors have more than 2 ohm of ESR so the upper limit on the ESR can usually be ignored, AND the load-transient method - Performing a load transient test and observing the amount of ringing on the output is the best way to determine if the capacitor selected is stable - with Figure 3 Load Transient Setup drawn as a MOSFET switch plus function generator and the sentence This setup is preferable to most electronic loads because the simulated transient is much faster. That closes the prior citation slip. The reduced p4 note also holds: p4 carries only Figure 4 TPS76050 Load Transient With 2.2-uF Ceramic Capacitor and the text The results in Figure 4 show multiple oscillations or rings after the initial spike, indicating instability ... Typically, four rings or less indicate sufficient phase margin for the device to be stable; the jig is no longer claimed for p4. Re-checked the rest: p1 names the three poles (dominant pole set in the error amplifier, load pole P(LOAD) formed by the output capacitor and load and therefore varies with load current, pass device pole P(PASS) formed by the parasitic capacitance of the pass element), states that a three-pole high gain system requires compensation, and calls using the ESR of the output capacitor typically the simplest and least expensive method for generating this zero, with the abstract scoping the whole report to LDO regulators with PNP or PMOS pass element; p2 Fig 1 carries the labelled Dominant Pole P(DOM), P(LOAD) with its Variation in R(LOAD) x C(LOAD) arrow, fZ(ESR) with its Variation in C(LOAD) x ESR arrow and P(PASS) near 1 MHz, the paragraph beneath gives both bounds (high enough that the 0 dB crossing is -20 dB/decade, low enough that gain is below 0 dB before P(PASS)), Fig 2 is the TPS76050 region of stability at CO = 2.2 uF and TJ = 25 C, and the NOTE reads The ESR used in these plots is the minimum ESR of the capacitor as ESR does vary over frequency; p5 Fig 5 is the same 2.2-uF ceramic plus a 1-ohm series resistor, settling without the ring train. Principle level with rule null and no envelope is right, and the PNP/PMOS provenance is disclosed in prose. Free strengthener for a later pass: the p6 Conclusion states the same convention more broadly - When designing with older linear regulators ... As the ESR is a function of frequency, the minimum ESR is used in simulations - without the these plots qualifier."}
