verification: {by: "second-reader", date: "2026-08-16", note: "Re-read Infineon p29 s9.4 and p30 Table 5 + the paragraph under it, plus ST p32 note 7. The s9.4 sentences are quoted verbatim, including 'each external signal termination must be in the same direction as it is done in the device implementation'. Table 5 does give pull-down to GND on TCK/SWCLK and 10k-100k pull-up to VDDIO on TMS/SWDIO, TDI and nTRST with an MCU-implementation column, and the 'possible voltage divider in the debug clock signal' caution is on p30 as quoted. Level principle with no envelope is right: the rule is supply, clock and connector independent. One imprecision that does not touch the rule: the p30 citation note reads the required-termination column as giving 'none on TDO/SWO', but that column requires a 10k-100k pull-up on TDO - 'None. Termination, push-pull driver implemented' is the MCU-implementation cell."}
