level: principle
maturity: approved
generalizes: []
verification:
  by: second-reader
  date: "2026-08-16"
  note: >
    Inherited from in-bias-return-path-required (task interface-in-2): the AD8226
    p22 must-sentence, Figure 62's six panels, Table 2 footnote 1 (pnp, current out)
    and AN1298 p14 were re-read visually and held. The level change (topology ->
    principle) is a U22 prep ruling proposal: the verified record's own envelope
    note states "the requirement itself does not scale". The two INA333 citations
    corroborate the same rule; second-read 2026-10-04 (U22 Q3), both held.
approval:
  by: perms
  date: "2026-10-04"
  note: >-
    Ruled 2026-10-04 by perms on the owner's standing redirect (#ai-ee
    1791102051.529859), U22 Q1; not the owner's own ruling. Merge of
    in-bias-current-return-path and in-bias-return-path-required into one
    principle with no envelope: the requirement does not scale, and the
    AD8226 Ib span was one part's spec, not a bound on the rule.
