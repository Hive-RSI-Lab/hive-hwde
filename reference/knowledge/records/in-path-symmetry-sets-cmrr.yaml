level: topology
envelope:
  mismatch_pct:
    max: 0.5
maturity: verified
generalizes: []
envelope_note: >-
  The converted differential error is the common-mode voltage times the fractional mismatch
  of the two input paths, so the rule scales with the mismatch. Mismatch is bounded at 0.5
  pct because that is the only value characterised in the sources (995/1005 ohm pairs, sboa582
  Fig 2-3); larger asymmetries are not covered by any cited figure.
verification:
  by: second-reader
  date: '2026-10-04'
  note: >-
    Second read 2026-10-04 against sboa582 p4, p5; ina333 p15, p16; slyt226 p1. Held: Equations
    7/8, Fig 2-3 (995/1005 ohm, 150 dB op amp gives 40 dB), Fig 2-4, slyt226 Fig 1 and the
    p15 matching sentence. Edits: added ina333 p16 source for the quoted 'two equal resistors'
    sentence; envelope mismatch_pct max cut from 1 to 0.5 (the only value characterised);
    envelope.vcm_v deleted (no source gives 5 V) with the linearization and 5 V envelope_note
    sentences; prose now says (G+1)/(4t) is for a four-resistor difference stage and that
    carrying it to stray in-amp asymmetry is inference, and that ina333 p15's few-pF warning
    is about stability, not CMRR.
