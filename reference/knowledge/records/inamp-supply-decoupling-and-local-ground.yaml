verification: {by: "second-reader", date: "2026-08-16", note: "Re-read AD8226 PDF p.22 (printed p.21, LAYOUT / Power Supplies, Figure 61, References). Every quote is verbatim: 'A stable dc voltage should be used to power the instrumentation amplifier. Note that noise on the supply pins can adversely affect performance'; 'A 0.1 uF capacitor should be placed as close as possible to each supply pin. As shown in Figure 61, a 10 uF tantalum capacitor can be used farther away from the part. In most cases, it can be shared by other precision integrated circuits'; and 'The output voltage of the AD8226 is developed with respect to the potential on the reference terminal. Care should be taken to tie REF to the appropriate local ground.' Figure 61 is titled exactly 'Supply Decoupling, REF, and Output Referred to Local Ground' and does draw 0.1 uF and 10 uF on each of the +Vs and -Vs pins, REF tied to the local ground symbol, and the LOAD returned to that same symbol. The two-tier distinction the record leans on (HF cap per pin and local, bulk per rail and shareable) is the vendor's own wording, not an embellishment. Scope guardrail clean: nothing here is called unnecessary, and the shareability of the bulk cap is quoted, not inferred. Nit: 'PSR is specified per gain' and the unity REF-to-output gain behind the IR-drop remark are Table 3 facts on PDF p.6, a page this record does not cite, though the cited page does point to the PSRR curves in Figures 23 and 24."}
