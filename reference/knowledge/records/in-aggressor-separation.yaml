verification:
  by: second-reader
  date: '2026-10-04'
  note: >-
    Second read 2026-10-04 against 01258b p17 and p4; ina333 p20 (Fig 40 viewed). Held: sensor
    traces separated from power/digital, amplifier near the sensor on the opposite surface,
    short straight power traces, p4 low-profile crosstalk, INA333 layout text and the Fig
    40 parallel input pair. Edits: removed from rule the unsupported unbroken-reference and
    coupling-budget keys and the output-as-aggressor and between-the-inputs claims, which
    prose now labels author reasoning only; envelope (vout_v, vsig_mv) and envelope_note dropped
    because 1 V and 100 mV appear in no source.
