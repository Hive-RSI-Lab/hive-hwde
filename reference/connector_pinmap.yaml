# Connector pin-map families - read by scripts/check_mate_pins.py
# (MECH-05 mated pairs, MECH-06 identical unkeyed connectors).
#
# A footprint belongs to a family when its footprint name (the part after
# "lib:") matches the family's `match` regex (case-insensitive, first family
# wins). Anything unmatched is UNKNOWN: a declared pair is still checked pin by
# pin, but the family rules below (mates, keyed) are skipped for it.
#
#   keyed  - false when a plug made for one of two identical footprints also
#            fits the other (bare pin headers and sockets). Two connectors on
#            one board with the same footprint id in an unkeyed family must
#            carry the same supply rail on every pin (mate_unkeyed_rail_swap);
#            a keyed family is skipped, because the plug only goes where it was
#            meant to and only one way round.
#   mates  - the families this one plugs into. A declared pair whose two
#            footprints are both known and not listed as mates is reported
#            (mate_family_mismatch), as is a pair whose pad patterns do not
#            overlay.
#
# How a declared pair is lined up (mount, in constraints.json mating_pairs):
#   stack - the mate board sits over or under this one the same way up (a
#           socket on its B.Cu over a header on this board's F.Cu). KiCad
#           stores a back-side footprint as placed, so pads of the two
#           connectors that touch sit at the same top-view offset from their
#           pad-pattern centres.
#   flip  - the mate board is turned over about its own y axis before mating
#           (both connectors on F.Cu facing each other): the mate's x offsets
#           are negated first.
#   cable - a straight-through cable or a pass-through pair: pin n meets pin n.
# `rotation` (degrees, counter-clockwise in top view) turns the mate board
# relative to this one before the overlay; pads meet within overlay_tol_mm.

defaults:
  overlay_tol_mm: 0.2

families:
  # JLC/EasyEDA names: HDR-TH_<n>P-P2.54-V-M (male) / -V-F (female)
  - name: pin-header-2.54
    match: '^(PinHeader_\d+x\d+_P2\.54mm|HDR-TH_\d+P-P2\.54-V-M)'
    keyed: false
    mates: [pin-socket-2.54, pin-header-2.54]
  - name: pin-socket-2.54
    match: '^(PinSocket_\d+x\d+_P2\.54mm|HDR-TH_\d+P-P2\.54-V-F)'
    keyed: false
    mates: [pin-header-2.54]
  - name: pin-header-2.00
    match: '^PinHeader_\d+x\d+_P2\.00mm'
    keyed: false
    mates: [pin-socket-2.00, pin-header-2.00]
  - name: pin-socket-2.00
    match: '^PinSocket_\d+x\d+_P2\.00mm'
    keyed: false
    mates: [pin-header-2.00]
  - name: pin-header-1.27
    match: '^PinHeader_\d+x\d+_P1\.27mm'
    keyed: false
    mates: [pin-socket-1.27, pin-header-1.27]
  - name: pin-socket-1.27
    match: '^PinSocket_\d+x\d+_P1\.27mm'
    keyed: false
    mates: [pin-header-1.27]
  # shrouded and polarised families: the housing only takes the plug one way
  - name: idc-box-header
    match: '^(IDC-Header|Box_?Header)'
    keyed: true
    mates: [idc-box-header]
  - name: jst
    match: '^JST_'
    keyed: true
    mates: [jst]
  - name: molex
    match: '^Molex_'
    keyed: true
    mates: [molex]
  - name: board-to-board
    match: '^(Hirose_DF\d+|Samtec_|Panasonic_AXK|Hirose_BM\d+)'
    keyed: true
    mates: [board-to-board]
