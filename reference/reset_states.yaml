# What pins do at reset, for check_straps.py: an MCU's strapping pins, its
# other pins the chip pulls at reset (reset_pulls), and
# the reset behaviour of the parts that can pull or drive them, or that
# hold a board's enables (IO expanders, oscillators).
#
# match: a regex tried against the part's Value (case-insensitive).
# Pins are named as the netlist's pinfunction gives them, upper-cased, with
# an EasyEDA "_<pin number>" suffix and KiCad's ~{...} overbar dropped
# ("IO0_25" -> IO0, "~{INT}_1" -> INT); `aliases` maps other names a
# symbol may use onto those.
# glitch: pins the chip itself drives or pulls during power-up, before
# firmware runs (Espressif's "pins with glitches at power-up" tables, and
# the ROM boot log on U0TXD), for check_reset_drive.py: `pins` a regex on
# the canonical pin name, `level` low | high | both | toggle, `us` how long.
# gpio: a regex on the canonical name, what this family calls a GPIO, for
# check_reset_drive.py (default ^IO\d+$).
# pin_split: a regex that splits a symbol's pin name into its names (default
# [/,]): "PB8-BOOT0", "PD3_(PCINT19/OC2B/INT1)".
# vdd: volts, or `supply` for the rail on the part's own supply pin.
# A strap may carry its own vil/vih, ohm, and connector_ok (a connector on the
# net isn't an unknown driver: a reset line on the debug header).
# dead_battery: UCPD pairs: a high on `db` puts `ohm` to ground on `cc` from
# reset until firmware disables it (check_straps dead_battery_rd).
# programming: pins a programmer clocks while the MCU is held in reset
# (check_straps programming_pin_load).
# verified: false means typed from memory of the datasheet, not re-read:
# check_straps says so in its finding, and the review that relies on it
# reads the datasheet once and flips it (with the date) here.
# mcu_like: part Values that are an MCU, known here or not. A board with one
# the `mcus` rows don't match has had nothing judged, and check_straps says so
# (mcu_unknown) rather than passing.
mcu_like: '^(STM32|STM8|GD32|CH32|CH5[0-9]|AT32|APM32|HC32|MM32|PY32|N32|ESP32|ESP8266|ESP8285|ESP8684|RP2040|RP2350|NRF5|NRF9|ATMEGA|ATTINY|ATSAM|AT90|SAM[DEL][0-9]|PIC1[0268]|PIC24|PIC32|DSPIC|MSP430|MSPM0|TM4C|TMS320|LPC[0-9]|MK[LEVWS][0-9]|MIMX|MCIMX|EFM32|EFR32|R7FA|R5F|CY8C|XMC[0-9]|LGT8|W80[0-9]|BL60[0-9])'

mcus:
  - family: ESP32
    match: '^ESP32(-D0WD|-D2WD|-S0WD|-U4WDH|-PICO|-WROOM-32|-WROVER|-SOLO|-MINI-1|-WROOM-DA)'
    vdd: 3.3
    vil: 0.25        # x VDD (ESP32 datasheet v4.x Table 5-3 DC characteristics)
    vih: 0.75
    pull_ohm: 45000  # internal weak pull-up/down, nominal
    enable: [EN, CHIP_PU, CHIP_EN]
    aliases: {MTDI: IO12, MTDO: IO15, MTMS: IO14, MTCK: IO13, BOOT: IO0,
              U0TXD: IO1, TXD0: IO1, U0RXD: IO3, RXD0: IO3}
    glitch:
      - pins: '^IO1$'
        level: toggle
        us: 20000
        why: "U0TXD carries the ROM boot log from reset (unless MTDO or the eFuse silences it)"
    straps:
      IO0: {pull: up, want: high, severity: error,
            why: "GPIO0 = 0 boots the UART download mode instead of the flash"}
      IO2: {pull: down, want: low, severity: warning,
            why: "download mode needs GPIO2 = 0 (or floating) with GPIO0 = 0; esptool can't flash the board otherwise"}
      IO12: {pull: down, want: low, severity: error,
             why: "MTDI = 1 sets VDD_SDIO to 1.8 V; the WROOM-32/WROVER(-E) flash and PSRAM are 3.3 V and the module won't boot"}
      IO15: {pull: up, want: any, severity: warning,
             why: "MTDO = 0 silences the ROM boot log on U0TXD (and sets SDIO slave timing)"}
      IO5: {pull: up, want: any, severity: warning,
            why: "GPIO5 sets the SDIO slave timing at boot"}
    source: ESP32 datasheet v4.x §2.4 Strapping Pins; ESP32-WROVER-E datasheet v2.4 §4 Table 5 (strap hold >= 1 ms after CHIP_PU)
    verified: true

  - family: ESP32-S3
    match: '^ESP32-S3'
    vdd: 3.3
    vil: 0.25
    vih: 0.75
    pull_ohm: 45000
    enable: [EN, CHIP_PU, CHIP_EN]
    aliases: {BOOT: IO0, U0TXD: IO43, TXD0: IO43, U0RXD: IO44, RXD0: IO44,
              USB_D-: IO19, USB_D+: IO20}
    glitch:
      - pins: '^IO([1-9]|1[0-7])$'
        level: low
        us: 60
        why: "GPIO1-17 glitch low for ~60 us at power-up"
      - pins: '^IO(18|19)$'
        level: both
        us: 60
        why: "GPIO18/19 glitch low then high for ~60 us each at power-up"
      - pins: '^IO20$'
        level: both
        us: 170000
        why: "GPIO20 is USB_D+: it glitches at power-up, and the USB-Serial-JTAG pull-up holds it high for up to ~170 ms until firmware takes the pin (or an eFuse disables USB)"
      - pins: '^IO43$'
        level: toggle
        us: 20000
        why: "U0TXD carries the ROM boot log from reset"
    straps:
      IO0: {pull: up, want: high, severity: error,
            why: "GPIO0 = 0 boots the download mode instead of the flash"}
      IO46: {pull: down, want: low, severity: warning,
             why: "GPIO46 = 1 with GPIO0 = 0 is an invalid boot combination; download needs it low"}
      IO45: {pull: down, want: low, severity: error,
             why: "GPIO45 = 1 sets VDD_SPI to 1.8 V; 3.3 V flash then fails (unless the eFuse overrides it)"}
      IO3: {pull: none, want: any, severity: warning,
            why: "GPIO3 picks the JTAG source when the eFuses leave it to the strap"}
    source: ESP32-S3 datasheet v1.x §3 Boot Configurations (strapping pins) and §2 pins with glitches at power-up; ESP32-S3 Hardware Design Guidelines (USB_D+ needs an external pull-up or the OTG download eFuse for a stable start)
    verified: false

  - family: ESP32-C3
    match: '^(ESP32-C3|ESP8685)'
    vdd: 3.3
    vil: 0.25
    vih: 0.75
    pull_ohm: 45000
    enable: [EN, CHIP_EN, CHIP_PU]
    aliases: {BOOT: IO9, MTCK: IO6, MTDO: IO7, U0RXD: IO20, RXD0: IO20,
              U0TXD: IO21, TXD0: IO21}
    glitch:
      - pins: '^IO(6|7)$'
        level: high
        us: 0.005
        why: "MTCK and MTDO glitch high for ~5 ns at power-up"
      - pins: '^IO(10|20)$'
        level: low
        us: 0.005
        why: "GPIO10 and U0RXD glitch low for ~5 ns at power-up"
      - pins: '^IO21$'
        level: toggle
        us: 20000
        why: "U0TXD carries the ROM boot log from reset"
    straps:
      IO9: {pull: up, want: high, severity: error,
            why: "GPIO9 = 0 boots the download mode instead of the flash"}
      IO8: {pull: none, want: high, severity: warning,
            why: "download mode needs GPIO8 = 1 with GPIO9 = 0 (it also sets the ROM log)"}
      IO2: {pull: none, want: high, severity: warning,
            why: "Espressif asks for GPIO2 pulled high at boot"}
    # Not straps, but pulled by the chip from reset until firmware drives
    # them: check_straps flags a load these switch on, or a connector they
    # reach with no other pull (load_on_at_reset, reset_pull_offboard).
    reset_pulls:
      IO4: {pull: up, why: "MTMS: the JTAG pad's pull-up is on from reset"}
      IO5: {pull: up, why: "MTDI: the JTAG pad's pull-up is on from reset"}
      IO6: {pull: up, why: "MTCK: the JTAG pad's pull-up is on from reset (minuet v3: the LED strip came on early)"}
    source: ESP32-C3 datasheet v1.x §2.4 Strapping Pins, §2 power-up glitches (MTCK/MTDO high, GPIO10/U0RXD low, ~5 ns), Table 2-4 IO MUX reset column; ESP32-C3 Hardware Design Guidelines §2.6; minuet v3 design-and-errata.md (GPIO6 pull-up at reset)
    verified: false

  - family: ESP32-C6
    match: '^ESP32-C6'
    vdd: 3.3
    vil: 0.25
    vih: 0.75
    pull_ohm: 45000
    enable: [EN, CHIP_EN, CHIP_PU]
    aliases: {BOOT: IO9, U0TXD: IO16, TXD0: IO16, U0RXD: IO17, RXD0: IO17}
    glitch:
      - pins: '^IO16$'
        level: toggle
        us: 20000
        why: "U0TXD carries the ROM boot log from reset"
    straps:
      IO9: {pull: up, want: high, severity: error,
            why: "GPIO9 = 0 boots the download mode instead of the flash"}
      IO8: {pull: none, want: high, severity: warning,
            why: "download mode needs GPIO8 = 1 with GPIO9 = 0"}
    reset_pulls:
      IO4: {pull: up, why: "MTMS: the JTAG pad's pull-up is on from reset"}
      IO5: {pull: up, why: "MTDI: the JTAG pad's pull-up is on from reset"}
      IO6: {pull: up, why: "MTCK: the JTAG pad's pull-up is on from reset"}
    source: ESP32-C6 datasheet v1.x §3 Boot Configurations and the IO MUX reset column
    verified: false

# Parts whose pins pull or drive a net at reset.
#   kind: expander  - every IO pin (pins: regex on the pin name) is an input
#                     at power-on with the internal `pull`; registers are
#                     reset only at POR, or by the part's `reset` pin
#                     (active low), so through an MCU-only reset its outputs
#                     keep whatever firmware set unless that pin follows the
#                     MCU's enable.
#   kind: input     - the named pins are inputs at reset (loads, not drivers)
  # Every GPIO is pulled down from reset (RP2040 datasheet Pinout table,
  # Reset State column; PADS_BANK0 GPIOn reset PDE=1, PUE=0).
  - family: RP2040
    match: '^RP2040'
    vdd: 3.3
    vil: 0.242             # VIL 0.8 V at IOVDD 3.3 V
    vih: 0.606             # VIH 2.0 V at IOVDD 3.3 V
    pull_ohm: 65000        # RPU, RPD 50-80 k
    enable: [RUN]
    aliases: {QSPI_CS: QSPI_SS, QSPI_CSN: QSPI_SS, QSPI_SS_N: QSPI_SS,
              QSPI_SSN: QSPI_SS, SWDIO: SWD}
    straps:
      QSPI_SS: {pull: up, want: high, severity: error,
                why: "the boot ROM skips flash when the QSPI chip select is tied low (the BOOTSEL button)"}
      TESTEN: {pull: down, want: low, severity: error,
               why: "factory test mode pin: tie to GND"}
    reset_pulls:
      # offboard: false, because every GPIO has this pull: a load it turns on
      # is load_on_at_reset, but each pin leaving the board isn't a finding.
      IO0: &rp_pd {pull: down, offboard: false,
                   why: "RP2040 GPIOs are pulled down from reset"}
      IO1: *rp_pd
      IO2: *rp_pd
      IO3: *rp_pd
      IO4: *rp_pd
      IO5: *rp_pd
      IO6: *rp_pd
      IO7: *rp_pd
      IO8: *rp_pd
      IO9: *rp_pd
      IO10: *rp_pd
      IO11: *rp_pd
      IO12: *rp_pd
      IO13: *rp_pd
      IO14: *rp_pd
      IO15: *rp_pd
      IO16: *rp_pd
      IO17: *rp_pd
      IO18: *rp_pd
      IO19: *rp_pd
      IO20: *rp_pd
      IO21: *rp_pd
      IO22: *rp_pd
      IO23: *rp_pd
      IO24: *rp_pd
      IO25: *rp_pd
      IO26: *rp_pd
      IO27: *rp_pd
      IO28: *rp_pd
      IO29: *rp_pd
      SWCLK: {pull: up, why: "SWCLK's pull-up is on from reset"}
      SWD: {pull: up, why: "SWD's pull-up is on from reset"}
    source: RP2040 datasheet build 2025-02-20 (3184e62) Pinout section Reset State column (GPIO pull-down, QSPI_CSn/SWCLK/SWD/RUN pull-up, TESTEN pull-down), PADS_BANK0 GPIOn register, IO electrical table (VIH 2 V, VIL 0.8 V at 3.3 V, RPU/RPD 50-80 k), bootrom "Check if SPI CS pin is tied low", section 1.4.3 "TESTEN Factory test mode pin. Tie to GND."
    verified: true

  # GPIOs are analog (hi-Z) from reset, so a gate on one floats; only the debug
  # pins pull. GPIOx_PUPDR reset: port A 0x6400 0000, port B 0x0000 0100.
  - family: STM32G4
    match: '^STM32G4'
    vdd: supply
    vil: 0.3             # all but FT_c pins
    vih: 0.7
    pull_ohm: 40000      # RPU, RPD 25-55 k
    enable: [NRST]
    gpio: '^P[A-G]\d{1,2}$'
    pin_split: '[-/,()\s]+'
    aliases: {PB8: BOOT0, PG10: NRST, SWDIO: PA13, SWDAT: PA13, JTMS: PA13,
              SWCLK: PA14, JTCK: PA14, JTDI: PA15, JTDO: PB3, NJTRST: PB4}
    straps:
      BOOT0: {pull: none, want: low, severity: error,
              why: "as shipped (nSWBOOT0 = 1) PB8 picks the boot space, and high boots the system-memory bootloader, not the flash; PB8 is free for other use only once nSWBOOT0 = 0 is programmed, and the first boot still reads the pin"}
      NRST: {pull: up, ohm: 40000, want: high, severity: error, connector_ok: true,
             why: "NRST held low keeps the chip in reset (it is reset mode at every POR until the option bytes load, even with NRST_MODE = GPIO)"}
    reset_pulls:
      PA13: {pull: up, why: "JTMS/SWDIO's pull-up is on from reset"}
      PA14: {pull: down, why: "JTCK/SWCLK's pull-down is on from reset"}
      PA15: {pull: up, why: "JTDI's pull-up is on from reset"}
      PB4: {pull: up, why: "NJTRST's pull-up is on from reset (cat 4 parts: only with PB4_PUPEN set)"}
    dead_battery:
      - {cc: PB6, db: PA9, ohm: 5100}
      - {cc: PB4, db: PA10, ohm: 5100}
    source: RM0440 Rev 7 section 2.6.1 (boot modes, PB8/BOOT0), 9.3.1 and 9.4.4 (debug pulls, PUPDR reset), 9.3.15-16, 7.1.2 (NRST), 46.4.6 and PWR_CR3 UCPD1_DBDIS (dead battery), 47.4.3; DS12589 Rev 6 (STM32G431) pin table notes 5, 6, Table 53 VIL/VIH/RPU, Table 57 NRST. G474 pins read from the netlists, its datasheet not read.
    verified: true

  - family: STM32F4
    match: '^STM32F4(05|15|07|17|27|37|29|39)'
    vdd: supply
    vil: 0.3
    vih: 0.7
    pull_ohm: 40000      # RPU, RPD 30-50 k
    enable: [NRST]
    gpio: '^P[A-K]\d{1,2}$'
    pin_split: '[-/,()\s]+'
    aliases: {BOOT1: PB2, SWDIO: PA13, SWDAT: PA13, JTMS: PA13, SWCLK: PA14,
              JTCK: PA14, JTDI: PA15, JTDO: PB3, NJTRST: PB4}
    straps:
      BOOT0: {pull: none, want: low, severity: error, vil: 0.13, vih: 0.38,
              why: "BOOT0 = 1 boots system memory or SRAM (BOOT1 picks), not the flash"}
      PB2: {pull: none, want: any, severity: warning,
            why: "BOOT1, read only with BOOT0 = 1"}
      NRST: {pull: up, ohm: 40000, want: high, severity: error, connector_ok: true,
             why: "NRST held low keeps the chip in reset"}
    reset_pulls:
      PA13: {pull: up, why: "JTMS/SWDIO's pull-up is on from reset"}
      PA14: {pull: down, why: "JTCK/SWCLK's pull-down is on from reset"}
      PA15: {pull: up, why: "JTDI's pull-up is on from reset"}
      PB4: {pull: up, why: "NJTRST's pull-up is on from reset"}
    source: RM0090 Rev 19 section 2.4 Table 2 (boot modes), 8.3.1 and 8.4.4 (debug pulls, PUPDR reset, input floating); DS8626 Rev 9 (STM32F407) Table 48 (BOOT0 VIL 0.1 VDD + 0.1, VIH 0.17 VDD + 0.7, here as fractions at 3.3 V; RPU, RPD 30-50 k), Table 51 NRST.
    verified: true

  - family: STM32F1
    match: '^STM32F10[1-357]'
    vdd: supply
    vil: 0.35            # "all I/Os except BOOT0"; BOOT0's own isn't in Table 36
    vih: 0.65
    pull_ohm: 40000      # RPU, RPD 30-50 k
    enable: [NRST]
    gpio: '^P[A-G]\d{1,2}$'
    pin_split: '[-/,()\s]+'
    aliases: {BOOT1: PB2, SWDIO: PA13, JTMS: PA13, SWCLK: PA14, JTCK: PA14,
              JTDI: PA15, JTDO: PB3, NJTRST: PB4}
    straps:
      BOOT0: {pull: none, want: low, severity: error,
              why: "BOOT0 = 1 boots system memory or SRAM (BOOT1 picks), not the flash"}
      PB2: {pull: none, want: any, severity: warning,
            why: "BOOT1, read only with BOOT0 = 1"}
      NRST: {pull: up, ohm: 40000, want: high, severity: error, connector_ok: true,
             vil: 0.24, vih: 0.61,
             why: "NRST held low keeps the chip in reset"}
    reset_pulls:
      PA13: {pull: up, why: "JTMS's pull-up is on from reset"}
      PA14: {pull: down, why: "JTCK's pull-down is on from reset"}
      PA15: {pull: up, why: "JTDI's pull-up is on from reset"}
      PB4: {pull: up, why: "NJTRST's pull-up is on from reset"}
    source: RM0008 Rev 21 section 3.4 Table 9 (boot modes), 9.1.1 (input floating, JTAG pulls); DS5319 Rev 19 (STM32F103x8/B) Table 36 (VIL 0.35, VIH 0.65 VDD except BOOT0; RPU, RPD 30-50 k), Table 39 NRST (0.8 V, 2 V, here as fractions at 3.3 V). Only the F103 datasheet read; F101/102/105/107 share the manual.
    verified: true

  # Every port pin is tri-stated by reset, its pull-up off; only RESET pulls.
  - family: ATmega48/88/168/328
    match: '^ATMEGA((48|88|168)P?A|328(?!PB))'
    vdd: supply
    vil: 0.3             # VCC 2.4-5.5 V (0.2 below that)
    vih: 0.6
    pull_ohm: 45000      # RRST 30-60 k
    enable: [RESET]
    gpio: '^P[B-D][0-7]$'
    pin_split: '[_/,()\s]+'
    aliases: {PC6: RESET, MOSI: PB3, MISO: PB4, SCK: PB5}
    straps:
      RESET: {pull: up, want: high, severity: error, connector_ok: true,
              vil: 0.1, vih: 0.9,
              why: "RESET low holds the chip in reset (unless the RSTDISBL fuse is programmed, then it is PC6)"}
    programming:
      pins: [PB3, PB5]   # MOSI, SCK (MISO is the chip's output)
      why: "serial downloading, with RESET low"
    source: Microchip DS40002061B (ATmega48A/PA/88A/PA/168A/PA/328/P) section 1.1.5 PC6/RESET, 14.2.1 "port pins are tri-stated when reset condition becomes active", 28.8 Serial Downloading and Table 28-17 (MOSI PB3, MISO PB4, SCK PB5), DC table (VIL 0.3, VIH 0.6, VIL2 0.1, VIH2 0.9 VCC; RRST 30-60 k).
    verified: true

parts:
  - match: '^(TCA9555|PCA9555)'
    kind: expander
    pins: '^P[01][0-7]$'
    pull: {dir: up, ohm: 100000}
    reset: null
    source: TI TCA9555 SCPS200E §5 and Fig. 23 (100 k internal pull-ups; POR only); NXP PCA9555 rev. 9 §8.1
    verified: true
  - match: '^(TCA9535|PCA9535|TCA9554|PCA9554|TCA9534|PCA9534|TCA9538|PCA9538)'
    kind: expander
    pins: '^P[01]?[0-7]$'
    pull: null
    reset: [RESET]     # TCA9538/PCA9538 only; the others have none
    source: TI TCA9535 SCPS201 (no pull-ups, POR only); TI TCA9534/TCA9538 datasheets
    verified: false
  - match: '^(TCA9539|PCA9539|TCA6416|TCA6408|PCAL6416|PCAL9555)'
    kind: expander
    pins: '^P[01]?[0-7]$'
    pull: null
    reset: [RESET]
    source: TI TCA9539 SCPS202C §8.3.2 (RESET pin, no pull-ups); TI TCA6416A SCPS194
    verified: false
  - match: '^MCP23(0|S)(08|17|18)'
    kind: expander
    pins: '^GP[AB]?[0-7]$'
    pull: null
    reset: [RESET]
    source: Microchip MCP23017 DS20001952 §1.6 (GPPU = 0 at reset, RESET pin)
    verified: false
  - match: '^PCF857[45]'
    kind: expander
    pins: '^P[01]?[0-7]$'
    pull: {dir: up, ohm: 33000}   # quasi-bidirectional: ~100 uA weak high at POR
    reset: null
    source: NXP PCF8574 §8.2 (outputs high with a weak current source at power-on)
    verified: false
  - match: '^LAN8720'
    kind: input
    pins: '^(NRST|RST|XTAL1/CLKIN|XTAL1|CLKIN|MDC|TXD[01]|TXEN)$'
    source: Microchip LAN8720A DS00002165B pin table
    verified: false
  - match: '^(W25Q|GD25Q|MX25[LU]|IS25[LW]P|AT25[SQ]F|S25FL)'
    kind: input
    pins: '^(CS|CS#|CSN|NCS|SS|SS#|/CS)$'
    source: SPI NOR flash pin tables (Winbond W25Q128JV CS input, no driver on it)
    verified: false
  - match: '^PCM510[0-9]'
    kind: input
    pins: '^(BCK|DIN|LRCK|SCK|XSMT|FMT|FLT|DEMP)$'
    source: TI PCM5102A SLAS859 pin functions (digital inputs)
    verified: false

# Oscillators are found by their pins, not their Value: a part whose
# reference starts with Y, X or OSC and which has an output pin (`output`)
# drives a clock whenever its enable pin (`enable`) is high or floating
# (the YSO110TR, SiT8008 and most XOs read a floating OE as enabled); a
# part with an output and no enable pin always runs.
oscillators:
  refs: '^(Y|X|OSC)[0-9]'
  output: '^(OUT|OUTPUT|CLK|CLKOUT|FOUT)$'
  enable: '^(OE|EN|ST|STBY|TRI-STATE|TRISTATE|E/D|OE/ST)$'
  enable_active: high
  float_enabled: true
  source: YXC YSO110TR datasheet p1 (enable "high voltage or floating"); SiTime SiT8008 OE/ST

# MOSFETs whose gate an enable line drives: the minimum VGS(th), so a gate
# that comes up mid-band at power-on can be told to conduct (review-2
# POWER-5: core's Q2 at 1.10 V).
fets:
  - match: '^2N7002'
    vth_min: 1.0
    source: JSCJ 2N7002 datasheet, VGS(th) 1.0-2.5 V at ID 250 uA
    verified: true
  - match: '^(BSS138|BSS138K)'
    vth_min: 0.8
    source: onsemi BSS138 datasheet, VGS(th) 0.8-1.5 V
    verified: false
  - match: '^(AO3400|AO3400A)'
    vth_min: 0.65
    source: AOS AO3400A datasheet, VGS(th) 0.65-1.45 V
    verified: false
