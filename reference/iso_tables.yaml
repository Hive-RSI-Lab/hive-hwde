# Isolation spacing tables for check_isolation (hive-hwde #353).
#
# Every row carries its own `verified` flag and source id. verified: true means
# the value was READ from the named document, not remembered. verified: false
# means nobody has read it: the row is there so the check can run, and any
# finding that rests on one says so (table_verified: false).
#
# IEC's own text is paid. IS 15382 (Part 1):2003 is India's published adoption,
# "identical with IEC 60664-1 (2002)", and its table pages were read as page
# images on 2026-11-01 (the PDF's text layer is an OCR with holes; do not
# re-derive rows from it). Table numbers differ by edition:
#   IS 15382 / IEC 2002   IEC 60664-1:2007   IEC 60664-1:2020
#   Table 1               Table F.1          Table F.1
#   Table 2               Table F.2          Table F.2
#   Table 4               Table F.4          Table F.5
#   Table 7a              Table F.7a         Table F.8
#   Table A.2             Table A.2          Table A.2 / F.10
# The 2007 numbers are as TI SLUAAR5 and SLUP419 quote them (F.7a isn't quoted
# there: from memory); the 2020 numbers are from IEC's own table of contents
# (preview PDF on vde-verlag.de). Values
# are those of the 2002 text: later editions were not read, so a change in them
# would not show here.
sources:
  is15382:
    title: IS 15382 (Part 1):2003, identical with IEC 60664-1 (2002)
    url: https://law.resource.org/pub/in/bis/S05/is.15382.1.2003.pdf
  slup419:
    title: TI SLUP419, Demystifying clearance and creepage distance (Table 5 quotes IEC 62368-1 Table 10)
    url: https://www.ti.com/lit/pdf/slup419
  sluaar5:
    title: TI SLUAAR5, Circuit board insulation design according to IEC60664 (worked interpolation, A.2 at 4000 m)
    url: https://www.ti.com/lit/pdf/sluaar5
  none:
    title: not read; typed from memory or borrowed from IEC 60664-1 on the assumption the tables agree

iec60664_1:
  # IS 15382 Table 1. Line-to-neutral V up to and including -> rated impulse V
  # by overvoltage category. SLUP419 Table 4 agrees on 50/150/300/600.
  rated_impulse:
    source: is15382
    verified: true
    rows:
      - {v: 50, I: 330, II: 500, III: 800, IV: 1500}
      - {v: 100, I: 500, II: 800, III: 1500, IV: 2500}
      - {v: 150, I: 800, II: 1500, III: 2500, IV: 4000}
      - {v: 300, I: 1500, II: 2500, III: 4000, IV: 6000}
      - {v: 600, I: 2500, II: 4000, III: 6000, IV: 8000}
      - {v: 1000, I: 4000, II: 6000, III: 8000, IV: 12000}
  # IS 15382 Table 2 footnote 2 (clause 2.1.1.2): reinforced takes the next of
  # these; a basic value off the series, or the top one, takes 160 % (3.1.5).
  preferred_impulse_kv: [0.33, 0.5, 0.8, 1.5, 2.5, 4.0, 6.0, 8.0, 12.0]
  # IS 15382 Table 2, Case A (inhomogeneous field), minimum clearance in air
  # up to 2000 m, by pollution degree. PD4 is PD3 with a 1.6 mm floor
  # (footnote 6). Interpolation between rows is allowed for internal circuits
  # (footnote 5, 2.2.2.3.2).
  clearance_impulse:
