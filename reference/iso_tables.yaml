  groove_x_mm: {source: is15382, verified: true, pd1: 0.25, pd2: 1.0, pd3: 1.5, pd4: 1.5}

# IEC 62368-1: Table 10 has four rows quoted with their table number in SLUP419
# Table 5, all equal to 60664-1 Table 7a's Case A at the same kV. The other rows
# are 7a's values on the assumption the agreement holds: unread. Table 17
# (creepage) was not found anywhere the tower can reach, so every creepage row
# borrows 60664-1 Table 4 and stays verified: false until someone reads it.
iec62368_1:
  clearance_verified_kv: {1.5: slup419, 2.5: slup419, 4.0: slup419, 6.0: slup419}
  clearance_borrows: iec60664_1.clearance_peak
  creepage_borrows: iec60664_1.creepage
  creepage_verified: false
  altitude_borrows: iec60664_1.altitude
  altitude_verified: false   # 62368-1 has its own table; not read
  rated_impulse_borrows: iec60664_1.rated_impulse
  rated_impulse_verified: false   # its Table 12; not read
  groove_x_borrows: iec60664_1.groove_x_mm
  groove_x_verified: false
  # Reinforced in 62368-1, from memory: clearance at 1.6 x the voltage, creepage
  # doubled. Not read.
  reinforced_verified: false
