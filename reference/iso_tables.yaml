    - {kv: 0.40, pd1: 0.02, pd2: 0.2, pd3: 0.8, verified: true, source: is15382}
    - {kv: 0.50, pd1: 0.04, pd2: 0.2, pd3: 0.8, verified: true, source: is15382}
