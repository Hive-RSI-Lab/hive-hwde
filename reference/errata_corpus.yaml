    summary: JTAG header pinout differs from the Altera standard
    source_quote: "JTAG pinout differs from Altera standard"
    fault_class: SCH (standard connector pinout)
    verdict: caught
    catch: {script: check_pinouts, kind: pinout_mismatch, refs: [J11]}
    note: >-
      A KiCad 5 legacy schematic, read through lib/legacy_net. J11's net
      names follow the Altera pinout on both revisions; the fault is at the
      FPGA end (rev.C puts /TCK on U6's TDO, /TDI on its TCK, /TDO on its
      TDI). check_pinouts judges each header pin by the JTAG pin function it
      meets on the IC, so rev.C fires and rev.C1 is clean.
