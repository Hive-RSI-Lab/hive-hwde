# The real-errata corpus (scripts/errata_corpus.py, docs/errata-corpus.md).
#
# Public open-hardware boards whose next revision fixed a defect the earlier
# one shipped with, each defect sourced from the designer's own errata at a
# pinned commit. For each defect: what hwde does with rev A. `catch` names a
# check hwde runs and the finding that is the defect; errata_corpus.py runs it
# on rev A (the finding must be there) and on rev B (it must be gone, so the
# check sees the fix and doesn't just fire on everything). A defect with no
# catch is a miss: `follow_up` is the check to build or the brief filed for it.
#
# verdict: caught (an hwde check finds it on rev A, unprompted by any
# constraint a designer would only write after knowing the bug) |
# caught_with_constraints (found once constraints.json states a fact the files
# lack, such as which mate a cable goes to: the catch's `constraints`) |
# missed | not_static (a fact no file holds: a firmware choice, a vendor's
# chip bug).
boards:
- id: digits
  url: https://github.com/justinlindh/digits
  commit: 9807030c8411bf854910b6e2bf4707fa4b47f7bf
  licence: AGPL-3.0
  rev_a: {name: v1, sch: hardware/pcb/v1/kicad/digits-pcb.kicad_sch,
          pcb: hardware/pcb/v1/kicad/digits-pcb.kicad_pcb}
  rev_b: {name: v2, sch: hardware/pcb/v2/kicad/digits-pcb.kicad_sch,
          pcb: hardware/pcb/v2/kicad/digits-pcb.kicad_pcb}
  source: hardware/pcb/v1/ERRATA.md
  defects:
  - id: digits-1
    summary: LM2596 switching node Net-(D1-K) routed at 0.25 mm (default class) for 3 A
    source_quote: "The trace connecting U1 OUT (pin 2), D1 cathode, and L1 is routed at 0.25mm"
    fault_class: PI (track width vs current)
    verdict: caught
    catch: {script: check_current, kind: undersized_track, net: Net-(D1-K)}
    note: >-
      With no constraints.json, check_current finds U1's OUT pin (an LM2596,
      reference/switch_nodes.yaml) and screens its net at the part's rated
      3 A at dT=60C: 0.25 mm fails (needs 0.72 mm); v2's 0.75 mm passes.
  - id: digits-2
    summary: J1 2x20 Pi header on B.Cu rotated 180 deg, so odd/even columns swap against the Pi below
    source_quote: "The combination of KiCad's automatic B.Cu mirror and the 180-degree rotation causes the odd/even pin columns to swap"
    fault_class: MECH (mating orientation)
    verdict: caught
    catch: {script: check_mate_pins, kind: mate_mirrored_pinout, refs: [J1]}
    note: >-
      J1 is the stock PinHeader_2x20 (numbered for F.Cu) on B.Cu, so KiCad's
      flip mirrors it; a mirror survives any rotation, so the 180 deg turn
      the errata blames is not what swaps the rows. check_mate_pins knows the
      Pi header by its supply pins (2 +5V, 6 GND) and compares the pattern's
      handedness, seen from above, with the Pi's face up below. v2 puts J1
      on F.Cu for a Pi face down above, which the rule does not judge.
  - id: digits-3
    summary: MIC_GND is a local label, not the GND symbol; the mic return floats
    source_quote: "MIC_GND is a floating net -- no connection to board GND"
    fault_class: SCH (net connectivity)
    verdict: caught
    catch: {script: netlist_audit, kind: ground_island, net: /MIC_GND}
  - id: digits-4
    summary: J7 bell terminal on single-pin nets BELL_1/BELL_2, wired to nothing
    source_quote: "J7 ... has no trace to anything else on the board. Its two pins drop onto single-pin nets"
    fault_class: SCH (net connectivity)
    verdict: caught
    catch: {script: netlist_audit, kind: dangling_net, net: /BELL_1}
- id: oasis
  url: https://github.com/justbuchanan/oasis
  commit: 3462f162f80e11c78705218441af37639d87bfdc
  licence: Apache-2.0
  rev_a: {name: v0.2, sch: pcb/fabricated-boards/v0.2/kicad/pcb.kicad_sch,
          pcb: pcb/fabricated-boards/v0.2/kicad/pcb.kicad_pcb,
          cpl: pcb/fabricated-boards/v0.2/positions.csv}
  rev_b: {name: mainboard-v0.3, sch: pcb/fabricated-boards/mainboard-v0.3/kicad/pcb.kicad_sch,
          pcb: pcb/fabricated-boards/mainboard-v0.3/kicad/pcb.kicad_pcb,
          cpl: pcb/fabricated-boards/mainboard-v0.3/positions.csv}
  source: pcb/fabricated-boards/v0.2/errata.md
  defects:
  - id: oasis-1
    summary: Q1/Q3 SI2328DS on Q_NMOS_GDS + stock SOT-23-3, so gate and source are swapped
    source_quote: "Gate and source are swapped on the footprint for the fan and mister mosfets"
    fault_class: LIB (symbol pin map vs package)
    verdict: caught
    catch: {script: netlist_audit, kind: sot23_pinout, refs: [Q1, Q3]}
    note: v0.3 keeps the GDS symbol and moves to lib:SOT-23-3-pinswapped-mosfet, so the rule is quiet there.
  - id: oasis-2
    summary: Rfbb1 BOM part an 0402 resistor (C844504) on an 0603 footprint
    source_quote: "I had accidentally selected an 0402 resistor, but the footprint on the board design was for an 0603"
    fault_class: DFA (BOM part vs footprint package)
    verdict: caught
    catch: {script: check_bom_sync, kind: bom_package_mismatch, refs: [Rfbb1]}
    note: >-
      check_bom_sync --live reads each LCSC number off the board and JLC's
      package for it; on a pcb-flow fab package stock_check makes the same
      comparison against BOM.csv's footprint. v0.3 buys C844759, an 0603.
  - id: oasis-3
    summary: MISTER1 connector placed 180 deg off at JLC assembly
    source_quote: "the part on the jlcpcb order is rotated 180 from what I have in my pcb layout"
    fault_class: DFA (CPL rotation)
    verdict: caught
    catch: {script: dfm, kind: cpl_rotation, refs: [mister1]}
    note: >-
      The board published the CPL it sent JLC (v0.2/positions.csv). dfm's
      shipped-CPL check fits each part's LCSC model to the board's pads:
      mister1 (a keyed JST-PH) is at 119 deg where the model needs 299, the
      180 the designer had JLC fix. v0.3's CPL puts it on the bottom at a
      rotation that fits, and the finding is gone. The same run flags more,
      judged by hand: PS1 (LDD-700LS) and U4 (SHT30) on v0.2 and PS1 on v0.3
      are real, 90 deg off (the LCSC model's pin rows run along x, KiCad's
      along y, and the Fabrication-Toolkit CPL adds no offset; JLC's own
      placement review most likely fixed them, as the boards work). J2's
      1.48 mm offset on v0.3 is real too: the footprint origin sits on the
      shield pad, not the body. Q1/Q3's no_fit on v0.3 is false: the board's
      lib:SOT-23-3-pinswapped-mosfet renumbers the pads, so a fit by pad
      number fails where one by geometry holds (sent to cpl_verify's owner).
  - id: oasis-4
    summary: J1 power-input wire holes too big (SolderWire-2.5sqmm, 3.0 mm drill)
    source_quote: "power input connection/holes are too big"
    fault_class: DFA (THT hole vs lead)
    verdict: caught
    catch: {script: check_connector_fit, kind: tht_hole_loose, refs: [J1]}
    note: >-
      J1 is a solder-wire footprint with no part to hold it to, so
      check_connector_fit sizes the wire from the copper feeding the pads:
      +18V's only feed is a pour's four 0.5 mm thermal spokes, about 5.4 A
      at a 20 degC rise (IPC-2221), a 0.75 mm^2 wire with a 1.25 mm
      conductor, which leaves 1.75 mm in the 3.0 mm hole. v0.3 drops the
      solder-wire pads for a header, and the finding is gone.
- id: minuet
  url: https://github.com/brown-studios/minuet
  commit: 1e43aa3df01b33522db23f4b2139f89b5689da99
  licence: MIT
  rev_a: {name: v3, sch: hardware/minuet/v3/minuet.kicad_sch,
          pcb: hardware/minuet/v3/minuet.kicad_pcb}
  rev_b: {name: v4, sch: hardware/minuet/v4/minuet.kicad_sch,
          pcb: hardware/minuet/v4/minuet.kicad_pcb}
  source: hardware/minuet/v3/design-and-errata.md
  defects:
  - id: minuet-1
    summary: no 1 uF capacitor FB_BK to GND_BK, which the MCF8316D datasheet asks for
    source_quote: "There should be a 1 uF capacitor from FB_BK to GND_BK according to the MCF8316D datasheet"
    fault_class: PI (datasheet-required pin capacitor)
    verdict: caught
    catch: {script: netlist_audit, kind: pin_part_missing, net: +3.3V, refs: [U5]}
    note: >-
      reference/pin_requirements.yaml carries the MCF8316D's Table 10-1
      (SLLSFX9A). v3's +3.3V rail has caps, all drawn on other sheets for
      other parts, so the finding is a warning that none was drawn for
      FB_BK; v4 draws C20 1u on /fan/ with the IC and the rule is quiet.
  - id: minuet-2
    summary: LMV331IDCK comparator's input common mode (Vcc-0.7 = 2.6 V) below the 3.1 V rain-sensor signal
    source_quote: "only allows a common mode input voltage up to Vcc - 0.7 V = 2.6 V whereas the actual signals are in the range of 3.1 V"
    fault_class: ANA (input common-mode range)
    verdict: caught
    catch: {script: netlist_audit, kind: input_common_mode, refs: [U2]}
    note: >-
      netlist_audit solves each input's DC level from the resistors to known
      rails and compares it with reference/opamp_cm.yaml: U2's - input rests
      at 3.09 V on the 68K/1M divider and + at 3.3 V (J3 open, dry), both
      above 2.6 V. v4 drops the comparator, so the rule is quiet there.
  - id: minuet-3
    summary: board areas over 50 C at 4 A per motor phase
    source_quote: "Some areas of the PCB reach over 50 C when operating the motor at 4 A peak per phase"
    fault_class: TH (copper area under a power IC)
    verdict: caught
    catch: {script: check_thermal, kind: thermal_area, net: GND}
    note: >-
      With no constraints.json check_thermal screens the power ICs
      reference/thermal_parts.yaml knows (#884): v3's MCF8316D (U5) sheds heat
      into 2-layer copper that gives 58 C/W against the datasheet's 25.7, so
      its 135 C thermal warning comes at ~4.2 A peak per phase from 25 C
      ambient (6.4 A on the datasheet's board). v4's 4-layer pours give U4
      42 C/W (1.65x, under the 2x bar) and the finding is gone.
  - id: minuet-4
    summary: ESP32-C3 GPIO6 (MTCK) pulled up by the ROM at reset turns the LED strip on before firmware runs
    source_quote: "The bootloader enables the GPIO6 pull-up on reset which interferes with its use for the Minuet light accessory"
    fault_class: FW-HW (reset-state pull on a load enable)
    verdict: caught
    catch: {script: check_straps, kind: reset_pull_offboard, net: GPIO6}
    note: >-
      check_straps reads the C3's reset_pulls (MTMS/MTDI/MTCK pull-ups) from
      reset_states.yaml: v3's GPIO6 leaves the board on the EXPANSION header
      J4.5 with only the chip's pull-up, so the light accessory's strip sees it
      high from reset. It also warns on GPIO5 (J4.6), bare the same way. v4
      (ESP32-C6) puts R13 100 k to 3V3 on GPIO6, a pull the accessory is
      designed for, and the finding is gone. On a board whose load is on the
      board itself, load_on_at_reset names the gate or enable instead.
  - id: minuet-5
    summary: an access-point WiFi connect resets the ESP32-C3 at full TX power
    source_quote: "The microcontroller spontaneously resets ... Reducing the WiFi output power to 19 dB resolves the issue"
    fault_class: FW (radio power)
    verdict: not_static
  - id: minuet-6
    summary: fan motor connector J8 has no A/B/C phase labels on silk
    source_quote: "Should add motor phase labels to the silkscreen for clarity"
    fault_class: DFA (connector pin labels)
    verdict: caught
    catch: {script: check_silk, kind: pin_labels_missing, refs: [J8]}
    note: >-
      J8's three pins carry /fan/A, /fan/B and /fan/C; check_silk reads a
      connector whose nets name three motor phases (A/B/C or U/V/W, bare or
      after PH/OUT/MOTOR) and looks for silk within 5 mm of its pads that
      names each one. On J8 only its refdes and two capacitors' are there;
      v4 labels the phases and the finding is gone. Two-pin power inputs are
      not judged: which pin is + is a polarity mark, not a pin label.
  - id: minuet-7
    summary: IR receiver U1's 3D model raised 17 mm where the built standoff is 16 mm
    source_quote: "The 3D model for the IR receiver should have a 16 mm standoff, currently it's set to 17 mm"
    fault_class: MECH (3D model height)
    verdict: missed
    note: >-
      U1's (model) is offset 20 mm in Z (v4: 19). Placed, the upstream STEP
      (library/TSOP39238/82827TVCastnonSMD.stp, not in the KiCad files the
      corpus reads) has its body's underside 16.0 mm above the board and its
      lead tips 1.4 mm past the bottom: a part that fits, and no reading of
      the model gives the 17 mm the designer names. What is wrong is the
      model against the build (a 16 mm printed standoff, the leads' reach),
      which no file of the board records.
    follow_up: a stated mounting height (constraints or a mech block) for raised THT parts (#980)
- id: glasgow
  url: https://github.com/GlasgowEmbedded/glasgow
  commit: 70cb38c9b03471acd2eabb76c82308891bec2ca5
  licence: 0BSD
  rev_a: {name: revD0, sch: hardware/boards/glasgow/revD0/glasgow.kicad_sch,
          pcb: hardware/boards/glasgow/revD0/glasgow.kicad_pcb}
  rev_b: {name: revD1, sch: hardware/boards/glasgow/revD1/glasgow.kicad_sch,
          pcb: hardware/boards/glasgow/revD1/glasgow.kicad_pcb}
  source: https://github.com/GlasgowEmbedded/glasgow/issues/1184
  defects:
  - id: glasgow-1
    summary: U24/U25 nRESET left floating
    source_quote: "U24/U25 pin nRESET cannot be left floating"
    fault_class: SCH (datasheet pin state)
    verdict: caught
    catch: {script: netlist_audit, kind: pin_state, refs: [U24, U25]}
    note: >-
      reference/pin_states.yaml (#1033): TCA6416A/PCA6416A RESET must not be
      open (TI SCPS194F, NXP PCA6416A Table 3). revD0 leaves both on
      unconnected-* nets; revD1 ties them up.
  - id: glasgow-2
    summary: U3 TMP112 and U21 DAC43204 answer on the same I2C address
    source_quote: "U3 TMP112 address conflicts with U21 DAC43204"
    fault_class: SCH (I2C address map)
    verdict: missed
    follow_up: "an I2C address map per bus, with each strap's supply domain (#1034)"
  - id: glasgow-3
    summary: U25 ADDR strap tied to the wrong power domain
    source_quote: "U25 pin ADDR connected to wrong power domain"
    fault_class: SCH (strap supply domain)
    verdict: missed
    follow_up: "an I2C address map per bus, with each strap's supply domain (#1034)"
  - id: glasgow-4
    summary: U4 FUSB302 SCL and SDA swapped on the schematic
    source_quote: "U4 FUSB302 address `0100011` does not scan on the bus (fix: swap SCL/SDA on schematic for revD1"
    fault_class: SCH (bus pin map)
    verdict: caught
    catch: {script: netlist_audit, kind: pin_net_swap, refs: [U4]}
    note: >-
      netlist_audit's pin_net_swap reads U4's SCL pin on /SDA and its SDA pin
      on /SCL; revD1 swaps them back and the finding is gone.
  - id: glasgow-5
    summary: STM32G031 MCU_nRST held near 1.2 V by an unprogrammed FX2/FPGA
    source_quote: "U6 STM32G031 has MCU_nRST input held at approx. +1.2V with unprogrammed FX2/FPGA"
    fault_class: ANA (pull vs pin leakage)
    verdict: missed
    follow_up: "pull strength against pin leakage and driver contention on a DC-solved net (#1026)"
  - id: glasgow-6
    summary: FX2 U8B and U2 can both drive MCU_nRST
    source_quote: "U8B and U2 can contend on MCU_nRST"
    fault_class: SCH (driver contention)
    verdict: missed
    follow_up: "pull strength against pin leakage and driver contention on a DC-solved net (#1026)"
  - id: glasgow-7
    summary: R9 100k pull-up loses to the unconfigured FPGA's 150 uA pull-down, so nALERT sits asserted
    source_quote: "value of R9 is too small; when unconfigured, FPGA U8B has an active pull-down of 150 uA (datasheet table 3.7, IPD), which is much bigger than the 33 uA required to drop all 3.3 V on the 100k resistor"
    fault_class: ANA (pull vs pin leakage)
    verdict: missed
    follow_up: "pull strength against pin leakage and driver contention on a DC-solved net (#1026)"
  - id: glasgow-8
    summary: INTB/DRDY lines on U6 pins that cannot take an interrupt
    source_quote: "move INTB/DRDY connections to U6 to interrupt-capable pins"
    fault_class: FW-HW (pin function)
    verdict: missed
    follow_up: "MCU pin function against the net's role (timer, PWM, EXTI) (#1032)"
  - id: glasgow-9
    summary: ADC AICOM pin left off GND though single-ended mode is referenced to it
    source_quote: "AICOM should be connected to GND (§7.3.2.2.1) since SE mode is referenced to AICOM"
    fault_class: SCH (datasheet pin state)
    verdict: caught
    catch: {script: netlist_audit, kind: pin_state, refs: [U7]}
    note: >-
      reference/pin_states.yaml (#1033): NAFE71388 AICOM belongs on ground,
      directly or through its series resistor (section 7.3.2.2.1). revD0 runs
      it through R34 to /ADC/REMOTE_COM; revD1 takes it to GND. A warning.
  - id: glasgow-10
    summary: BUSY/CSSPIN on RD instead of a FLAG pin
    source_quote: "connect BUSY/CSSPIN to one of FLAG{A,C,D} (instead of RD) via R40 and populate R40"
    fault_class: FW-HW (pin function)
    verdict: missed
    follow_up: "MCU pin function against the net's role (timer, PWM, EXTI) (#1032)"
- id: echoplayer
  url: https://github.com/amachronic/echoplayer
  commit: 50f31a141c4c171ea014890c1445da6ae1125143
  licence: CERN-OHL-S-2.0
  rev_a: {name: r1-rev1, sch: r1-rev1/echo-r1-rev1.kicad_sch, pcb: r1-rev1/echo-r1-rev1.kicad_pcb}
  rev_b: {name: r1-rev1.1, sch: r1-rev1.1/echo-r1-rev1.1.kicad_sch, pcb: r1-rev1.1/echo-r1-rev1.1.kicad_pcb}
  source: r1-rev1/docs/errata.md
  defects:
  - id: echoplayer-1
    summary: USB3320C ID pin grounded on a device-only board, so the core starts as a host
    source_quote: "the ID pin is connected to ground, which causes the DWC2 USB core to go into host mode"
    fault_class: SCH (datasheet pin state)
    verdict: caught
    catch: {script: netlist_audit, kind: pin_state, refs: [U8]}
    note: >-
      reference/pin_states.yaml (#1033): USB3320 ID grounded makes an
      A-device (DS00001792F Table 2-1, 5.6.1), a warning as a host board may
      mean it. rev1.1 ties U8's ID to 3V3, as the datasheet allows.
  - id: echoplayer-2
    summary: HP/LO 3.5 mm jacks wired against the standard headphone pinout
    source_quote: "Due to a mistake in the pin assignment for the 3.5mm jack footprint, both jacks are incorrectly wired and will not work with standard headphones."
    fault_class: LIB (standard connector pinout)
    verdict: caught
    catch: {script: check_pinouts, kind: pinout_mismatch, refs: [J4]}
    note: >-
      check_pinouts reads J4's pads T/R1/R2/S from their names: rev1 has the
      tip on /audio/hp_com and left on R1 (J5, the line out, has its tip on
      GND and fires too); rev1.1 has both in the CTIA order.
  - id: echoplayer-3
    summary: ESD diodes D1-D4 load the SDMMC lines past the bus's capacitance limit
    source_quote: "Diodes D1-D4 should be left unpopulated since they add too much capacitance and cause the SDMMC bus to fail at higher speeds."
    fault_class: SI (bus capacitive load)
    verdict: missed
    follow_up: "a per-bus capacitive load budget, ESD arrays included (#1031)"
- id: bedlift
  url: https://github.com/j9brown/bed-lift
  commit: 6b50533452337175c8b3f47198b3920d8391fd2b
  licence: MIT
  rev_a: {name: v0.2, sch: hardware/v0.2/bed-lift.kicad_sch, pcb: hardware/v0.2/bed-lift.kicad_pcb}
  rev_b: {name: v1, sch: hardware/v1/bed-lift.kicad_sch, pcb: hardware/v1/bed-lift.kicad_pcb}
  source: hardware/v0.2/design-and-errata.md
  defects:
  - id: bedlift-1
    summary: lift actuator connectors J8/J9 pins 2 and 3 swapped, reversing the hall sensors' supply
    source_quote: "The lift actuator connector pins 2 and 3 are swapped which reverses the polarity of the power supply to the hall sensors."
    fault_class: SCH (off-board connector pinout)
    verdict: caught_with_constraints
    catch:
      script: check_pinouts
      kind: pinout_mismatch
      refs: [J8]
      constraints:
        rev_a: {pinouts: [{ref: J8, standard: bedlift-lift-actuator}]}
        rev_b: {pinouts: [{ref: J10, standard: bedlift-lift-actuator}]}
    note: >-
      v0.2 has pin 2 on VHALL and pin 3 on GND; v1 has pin 2 on GND and pin 3
      on +5V. Only the actuator's own pinout says which is right, so the
      catch states the mate (reference/connector_pinouts.yaml
      bedlift-lift-actuator) on J8 (v1's actuator connector is J10).
  - id: bedlift-2
    summary: DRV8434S nSCS tied to GND, but the part needs a falling edge to start each SPI frame
    source_quote: "nSCS was tied to ground because it was believed no chip select was needed due to the absence of other devices on the SPI bus."
    fault_class: SCH (datasheet pin state)
    verdict: caught
    catch: {script: netlist_audit, kind: pin_state, net: GND, refs: [U7]}
    note: >-
      reference/pin_states.yaml (#1033): DRV8434S nSCS must be driven, as each
      frame needs it high between (SLOSE70 7.5.1.2). v0.2 ties U7-U10's nSCS
      to GND; v1 drives them from the MCU.
  - id: bedlift-3
    summary: DRV8434S STEP not on a hardware-timer pin, so stall detection sees jitter
    source_quote: "The STEP pulses must be generated by a hardware timer instead."
    fault_class: FW-HW (pin function)
    verdict: missed
    follow_up: "MCU pin function against the net's role (timer, PWM, EXTI) (#1032)"
  - id: bedlift-4
    summary: DRV8434S VREF wired straight to DVDD, 5 V where 3.3 V is recommended
    source_quote: "The DRV8434S VREF pin is directly connected to DVDD without a voltage divider which results it in receiving 5 V instead of the recommended 3.3 V."
    fault_class: SCH (datasheet pin range)
    verdict: caught
    catch: {script: netlist_audit, kind: pin_state, refs: [U7]}
    note: >-
      reference/pin_states.yaml (#1033): DRV8434S VREF is limited to 3.3 V and
      DVDD is 5 V (SLOSE70 6.3, 8.2.2.2), so VREF on the part's own DVDD
      fires. v1 feeds it through a divider.
  - id: bedlift-5
    summary: LIFT1 IN2 on an MCU pin with no timer channel, so the motor cannot be driven by PWM
    source_quote: "Unfortunately, one of the motor driver inputs must be relocated to use the timer function."
    fault_class: FW-HW (pin function)
    verdict: missed
    follow_up: "MCU pin function against the net's role (timer, PWM, EXTI) (#1032)"
  - id: bedlift-6
    summary: actuator hall sensors powered at 3.3 V where they are meant for 5 V
    source_quote: "They are intended to be driven at 5 V and while they seem to tolerate 3.3 V most of the time, sometimes they produce inconsistent pulses or no pulses at all."
    fault_class: SCH (off-board part supply)
    verdict: caught_with_constraints
    catch:
      script: check_pinouts
      kind: pinout_supply_volts
      net: /VHALL
      constraints:
        rev_a: {pinouts: [{ref: J8, standard: bedlift-lift-actuator}]}
        rev_b: {pinouts: [{ref: J10, standard: bedlift-lift-actuator}]}
    note: >-
      /VHALL is U4's output (a 74LVC1G17 on +3.3V), so check_pinouts puts it
      at 3.3 V against the 5 V the actuator row asks on its supply pin; v1
      feeds pin 3 from +5V.
