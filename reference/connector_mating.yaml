# Connector mating families - read by scripts/lib/matinglib.py (place gate via
# place_metrics.py, verify gate via check_mating.py).
#
# A footprint is a MATING connector when its footprint name (the part after
# "lib:") matches one family's `match` regex (case-insensitive, first family
# wins, so the specific horizontal families come before the generic vertical
# ones). Anything unmatched is not checked: wire pads, pogo pads and test
# points are out of scope; a J/P part left out is named in
# check_mating's not_judged, so read that list when a new connector appears.
#
# A J/P/CN/CON part whose footprint name matches no family is then tried, in
# order, on its Value, its MPN (footprint property, else its parts.json row)
# and its LCSC category (the parts.json row's category, else the end of its
# LCSC description) through `categories` below (#953): EasyEDA names like
# SIM-SMD_8P-1040310811 hide what the part is, but the value says microSD.
# Other refs are never matched on value (an "SMA" diode is not a connector).
#
# entry: horizontal - the plug goes in parallel to the board. The mouth must
#          face a board edge and sit at or over it (mouth_tol_mm inside at
#          most: the courtyard front, which is what is measured, sits a
#          little ahead of the body, and the copper-to-edge rule keeps pads
#          off the edge), and no part on the connector's side may sit in the
#          insertion zone: the mouth's own width from the mouth face to the
#          board edge, then that width plus grip_mm each side out to
#          plug_mm + grip_mm past the edge.
#        vertical   - the plug comes straight down. No part taller than
#          tall_mm may sit within finger_mm of the connector's courtyard
#          (another vertical mating connector is exempt: a header row
#          beside a header row is how they are mated).
#
# Mouth direction (horizontal only) comes from the PAD LAYOUT: the contact
# pads (the most common pad size) sit at the back of the housing and the body
# extends from them toward the mouth, so the mouth points from the contact-pad
# centroid toward the courtyard centroid, snapped to the nearest axis. A
# footprint where that is wrong gets a `mouth` entry here: footprint-name
# regex -> local direction (+x, -x, +y, -y in the footprint's own frame,
# KiCad y down). On the boards corpus (2026-10-02) the pad-layout reading
# put every edge connector of a board that mates as built facing its edge,
# so no override was needed.
#
# The part's own datasheet extraction comes before both (#952): its
# mechanical.entry.contacts_at ("back" or "mouth", from the drawing) says
# which end of the housing the contact tails are at, and the mouth is read
# from that and the pads. Where it disagrees with a `mouth` entry or the
# pad rule, the extraction wins and check_mating warns
# (mating_mouth_disagrees). The `mouth` entries are the fallback for parts
# with no extraction.
#
# The name is a hint and the copper is the part: a connector whose SMD pads
# sit on both outer copper layers straddles the board edge, so it is checked
# as horizontal even when its name matched a vertical family (an edge-launch
# SMA named like a vertical one went unchecked on PCB-0023-A). A horizontal
# connector's 3D model must also reach ahead of its contact pads toward the
# mouth (mating_model_reversed), or every render shows it the wrong way round.

defaults:
  plug_mm: 15.0
  grip_mm: 3.0
  mouth_tol_mm: 1.0
  finger_mm: 2.5
  tall_mm: 3.0

families:
  # 87520: Amphenol FCI's through-hole USB-A receptacle, named by part number
  # alone in EasyEDA (laptop hub J4/J5, #911)
  - {family: usb_a, entry: horizontal, plug_mm: 30.0,
     match: 'USB-?A\b|USB_A|(^|[^0-9])87520-'}
  # USB_C_Receptacle_* / USB_C_Plug_*: KiCad's stock library names (laptop hub
  # J1, minuet J6 went unjudged, #911)
  - {family: usb_c, entry: horizontal, plug_mm: 20.0,
     match: 'US[BC]-?C|TYPE-?C|USB_C_(RECEPTACLE|PLUG)'}
  - {family: usb_micro_mini, entry: horizontal, plug_mm: 20.0,
     match: 'MICRO-?USB|MINI-?USB|USB_MICRO|USB_MINI|USB-SMD_USB-111|USB-?B\b|USB_B'}
  - {family: barrel_jack, entry: horizontal, plug_mm: 25.0,
     match: 'DC-?JACK|BARREL|DC-0\d\d|PJ-0\d\d'}
  # 8P8C plug body 22.5 mm (AIM-Cambridge 32-5998UL, Emitex EM06.015) plus a
  # 26.5-28 mm boot (Emitex EM06.107, Klein VDV824-650) over the cable: 30 is
  # the plug and the start of the boot. Adam Tech MTJ-889X1 is a side-entry
  # 8P8C jack (MTJ catalog, Type 9).
  - {family: rj45, entry: horizontal, plug_mm: 30.0,
     match: 'RJ-?45|8P8C|(^|[^0-9])MTJ-88\d'}
  # 6P (RJ11/RJ12) plug: 13.35 mm long (Multicomp 7001-6P4C, 8588-0188A).
  # Adam Tech MTJ-669X1 is a side-entry 6P6C jack.
  - {family: modular_6p, entry: horizontal, plug_mm: 13.4,
     match: 'RJ-?1[12]\b|6P[46]C|(^|[^0-9])MTJ-66\d'}
  # right-angle RCA jack (Lian Xin XDJK-0271, stacked pair): the RCA plug is
  # 36.5 mm tip to the end of its cover (CUI RCP-01 drawing).
  - {family: rca_jack, entry: horizontal, plug_mm: 36.5,
     match: 'XDJK-|RCA'}
  - {family: card_slot, entry: horizontal, plug_mm: 15.0,
     match: 'MICRO-?SD|TF-?CARD|TF-(SMD|PUSH)|SD-?CARD|SIM-?CARD|NANO-?SIM|(^|[^0-9])104031-?\d'}
  # a wire-to-board plug or an FPC tail is held by its wires, so a short
  # ledge of board in front of the mouth does not stop it going in
  - {family: fpc_ffc, entry: horizontal, plug_mm: 8.0, grip_mm: 2.0,
     mouth_tol_mm: 1.5,
     match: 'FPC|FFC'}
  # BAT Wireless: KWE = right-angle edge, KE = "PCB-end" edge-launch that
  # straddles the board (BWSMA-KE-P001, C496550); KHD and the rest are vertical.
  # The suffix decides KE: -P001 is the edge launch, -Z001 (C496549) is a
  # vertical 5-pin THT jack (#428), so KE needs -P (or nothing) after it.
  - {family: sma_edge, entry: horizontal, plug_mm: 15.0,
     match: '(CON|BW)?SMA.*(EDGE|KWE|[-_]KE([-_]P|$))'}
  # JST/Molex wire-to-board, side entry: JST S<n>B-/SM<n>B- (SH-SM08B-GHS-TB
  # too), and KiCad's *_Horizontal library names
  - {family: wire_to_board_side, entry: horizontal, plug_mm: 12.0,
     mouth_tol_mm: 1.5,
     match: '(^|[^A-Z])SM?\d+B-|JST_.*HORIZONTAL|MOLEX_.*HORIZONTAL|JST\d+[-_].*_RA$'}
  - {family: header_right_angle, entry: horizontal, plug_mm: 12.0,
     match: 'HDR-.*-R-|PIN(HEADER|SOCKET)_.*HORIZONTAL'}
  # Amass XT/MR right-angle power (PW suffix): pins at the rear, retention legs
  # toward the mouth. A plug and its wires take room, so the zone is long (hc-power
  # J1 turned its mouth into the board and nothing judged it).
  - {family: xt_power, entry: horizontal, plug_mm: 30.0,
     match: '(XT(30|60|90)|MR(30|60))[-_]?PW'}
  - {family: bnc_right_angle, entry: horizontal, plug_mm: 25.0,
     match: 'BNC.*KWE'}
  # pluggable terminal block, right-angle header: the plug and its wires enter
  # from the side away from the pins
  - {family: pluggable_terminal, entry: horizontal, plug_mm: 15.0,
     match: '(KF2?|15)EDGR'}
  # screw terminal block with side wire entry: the wire goes in parallel to
  # the board through the openings on one face, the screws are on top. The
  # "plug" is the stripped end (KF301 4-5 mm, Phoenix PT 1,5/..-H 5 mm,
  # Dorabo DB128 6-7 mm stripping lengths); the insulated lead runs on. A
  # block a few mm in from the edge still takes its wire, so the mouth may
  # sit 3 mm inside. The wires go in through openings inside the block's own
  # width and are held by their insulation well past the edge, so the zone
  # is the block's width with no grip beside it (core J11's wire runs 1 mm
  # from the RCA jack J4 beside it, and is still wired by hand). The pads
  # are all one size, so the pad rule reads little: each name has a `mouth`
  # entry below, read from its 3D model and drawing.
  - {family: screw_terminal_side, entry: horizontal, plug_mm: 7.0,
     grip_mm: 0.0, mouth_tol_mm: 3.0,
     match: 'KF301-|DB128[VL]-|WJ500V-|TERMINALBLOCK_PHOENIX_PT-.*-H_.*HORIZONTAL'}
  # Staeubli 24.243 4 mm safety jack lying on the board: the bore is 7.5 mm up, so
  # low parts don't block a plug, but a 4 mm plug and its lead still need a clear
  # run (emc-lab LISN J2/J4 pointed 40 mm across the board at J1/J3).
  - {family: jack_4mm, entry: horizontal, plug_mm: 40.0, mouth_tol_mm: 8.0,
     match: '24\.243'}
  # vertical
  - {family: wire_to_board_top, entry: vertical,
     match: '(^|[^A-Z])BM?\d+B-|JST_.*VERTICAL|MOLEX_.*VERTICAL'}
  - {family: box_header, entry: vertical,
     match: 'IDC|BOX|PZ127VS'}
  - {family: pin_header, entry: vertical,
     match: 'HDR-|PIN(HEADER|SOCKET)_|DS1021'}
  # N female 4-hole flange jack, straight (17.5 mm flange): the N plug's
  # coupling nut is 21.0 mm across (Amphenol Type N catalog, N cable plugs,
  # dimension b), 1.75 mm past the flange each side, and a hand turns it.
  - {family: n_flange, entry: vertical, finger_mm: 4.25,
     match: '(^|[^A-Z])N-KFD'}
  # DreamLNK DL-MMCX-KE-180: straight through-hole jack, the plug comes down
  # on the barrel. The plug body is 3.48 mm across (Cinch 135-3436-001), about
  # the 3.6 mm flange, so the default finger room stands.
  - {family: mmcx_vertical, entry: vertical,
     match: 'MMCX'}
  # Amphenol SMPM 925-143J-51P: straight surface-mount jack (925-126J is the
  # edge-mount one). Plug body diameter not found in a datasheet: default
  # finger room until it is (#1016).
  - {family: smpm_vertical, entry: vertical,
     match: 'SMPM'}
  # SMA alone is also the DO-214AC diode package (SMA_L4.3-W2.6...), so the
  # connector has to be named as one. Any BAT Wireless BWSMA the edge rule
  # did not take is vertical.
  - {family: sma_vertical, entry: vertical,
     match: 'CONSMA|SMA-SMD|SMA-TH_|BWSMA|SMA[-_](JACK|CONN|VERT)|COAXIAL'}

# LCSC category regex -> family name, for a connector the footprint name,
# value and MPN leave unmatched. Only categories that name one family: "USB
# Connectors" covers A, C and micro alike, so it is not here.
categories:
  'Card (Connector|Socket)|Card Holder|SIM Card': card_slot
  'Ethernet Connectors|Modular Connectors': rj45
  'DC Power Connectors|Barrel': barrel_jack
  'FFC.*FPC|FPC.*Connector': fpc_ffc

# footprint-name regex -> mouth direction in the footprint's local frame
mouth:
  # the pads don't show it; the 3D model's bore is at local +X (LISN review B1)
  '24\.243': '+x'
  # Molex 104031 microSD ("inner lead"): the card goes in at the end with the
  # 8 signal tails (drawing SD-104031-001), the opposite of what the pad
  # rule reads. EasyEDA's SIM-SMD_8P-1040310811 has those tails at local +y.
  # The laptop hub shipped J6 backwards because no row knew it (#911).
  '(^|[^0-9])104031-?0811': '+y'
  # screw terminals (#951): every pad the same size, so the wire entry is
  # read from each part's 3D model and drawing. KF301-5.0 (EasyEDA model,
  # rotated 0): openings at model -y, which KiCad's y flip makes local +y.
  'KF301-': '+y'
  # Dorabo DB128V-5.08: model turned 180, openings at local +y; the
  # silkscreen arrows on that side point the same way.
  'DB128[VL]-': '+y'
  # WJ500V-5.08 (EasyEDA model, rotated 0): openings at model +y = local -y.
  'WJ500V-': '-y'
  # Phoenix PT 1,5/..-H (KiCad library): wire entry at local +y, the side
  # the courtyard reaches 5.5 mm (4.5 on the screw side) - checked on a
  # render of digits-v1 J7.
  'TERMINALBLOCK_PHOENIX_PT-.*-H_': '+y'
