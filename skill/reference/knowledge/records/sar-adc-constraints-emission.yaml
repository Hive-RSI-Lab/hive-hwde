verification: {by: "research-second-reader", date: "2026-08-16", note: "Checked hardest, as the record that turns into copper. SPRABY5 is gone from sources[] - the reference placement group is now cited to ads8326 p.22, and p.22 genuinely carries BOTH halves verbatim: 'a 47uF tantalum capacitor with low ESR should be connected as close as possible to the input pin' AND 'if a high output impedance reference source is used, an additional operational amplifier with a current-limiting resistor must be placed in front of the capacitors'. p.27 fig 44 rendered and read: REF3225 on AVDD -> 10 ohm -> 2.2uF -> OPA350 -> 47uF straight into REF with NOTHING between cap and pin, OPA365 -> 10 ohm -> 1000pF -> +IN, and ADS8326 VDD taken off DVDD (2.7-3.6V) through a 5 ohm with 0.1uF + 10uF at the pin - so the emitted placement group and its resistor ORDER are shown in TI's own application circuit, independent of the disputed figure. p.26 verbatim on instantaneous reference current, the 0.1uF/1-10uF/5-10 ohm set and the GND point away from the MCU. p.20 verbatim on -IN as a remote-ground sense (-0.3V to +0.5V). AN688 p.2 fig 2b rendered: connector at top, Digital zone nearest it, a 'Digital Buffer' strip on the split, Analog with the A/D furthest away - the zoning note is exact. AN688 p.4 fig 7 carries C = w L eo er / d and I = C dV/dt as cited. No orphaned source entry: all six still support something the prose or rule says. Two hygiene items, neither a refutation: (1) the prose cites '(p.19, under 10 mW from VDD)' for rule.thermal_entry but there is no p.19 sources[] entry - the page is in the ledger and the quote is verbatim ('consuming less than 10mW from VDD'), so the claim is supported, but the citation should be listed; (2) 'adjacent to the REF and GND pins' goes one step past p.22, which says only 'as close as possible to the input pin' - the GND half is loop closure, consistent with fig 42/44 and with the power-loop record, so it is a sound derivation rather than a quote."}
