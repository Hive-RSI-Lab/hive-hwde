envelope_note: >
  Scales with R_O*C_LOAD against the amplifier's gain bandwidth - the pole
  moves with that product, so a faster amplifier or a lower open-loop output
  impedance tolerates more capacitance for the same phase margin. The closed
  form assumes a UNITY-GAIN buffer (1/beta at 0 dB, closure at f_gbw) and an
  R_O that is flat and resistive across the useful band (sboa418 p2); an
  amplifier with a complex output impedance, or the same amplifier configured
  in gain, changes the closure frequency and needs the loop simulated rather
  than this equation. Nothing here depends on the supply or the signal level.
verification: {by: "research-second-reader", date: "2026-08-16", note: "Re-measured BOTH figures from scratch out of the PDF vector geometry and then cross-checked them against an independent 864-dpi raster pixel scan of the same pages, because this record has been edited twice and got worse in between. The current numbers are the right ones. opa333 p11 fig 15: the plot frame is the single path (97.73, 90.86) to (279.99, 214.32); 19 printed gridlines fit px = 6.684 + 91.033*log10(C_pF) with a max residual of 0.0034 decade, and the 7 interior horizontal gridlines sit on an exact 8-way split of the frame to within 0.023 pt, so frame bottom is 0 percent and frame top is 40 percent. The trace is exactly two cubic beziers, (99.42,214.17) to (204.17,171.68) to (260.07,91.28). Evaluated off that: span 10.44 pF to 607 pF, terminating at 39.9 percent on the frame top; 100 pF gives 9.74 percent, 300 pF gives 24.48 percent, 470 pF gives 33.68 percent, and 7 percent falls at 69.3 pF with 15 percent at 161.6 pF. The independent raster scan (curve runs isolated by stroke thickness, vertical gridline columns discarded) agrees to within 0.1 percentage point at every point tested - 69 pF 6.99, 100 pF 9.76 by interpolation across the decade gridline, 150 pF 14.04, 162 pF 15.06, 300 pF 24.5 by interpolation, 470 pF 33.70, 605 pF 39.63 - and finds zero curve pixels anywhere beyond 609 pF, so the trace really does stop there rather than being clipped or overpainted. On the overpaint trap specifically: exactly two paths overlap the fig 15 frame, the frame rect and the curve, and neither is a white fill, so there is no white rectangle inflating this read. The record is therefore right on all three counts that changed - 100 pF is about 10 percent not 7, 300 pF is about 25 percent not 15, and there is no 1000 pF point at all. sboa418 p9 fig 5-1: four 114-segment polylines, matched to phase margin by legend swatch colour (black 75, red 60, dark teal 45, cyan 30 - each swatch line sits on the vertical centre of its own legend text). y frame 343.47 = 0 V, 156.32 = 0.016 V on 8 equal divisions. All four traces start at 0.099 mV and end at 10.0875 mV, so the settled level is 10.09 mV as claimed. Peaks: 75 deg 10.0875 (no overshoot, its peak IS the settled level), 60 deg 11.0394, 45 deg 12.5261, 30 deg 14.3305 mV - the record's 10.09 / 11.04 / 12.53 / 14.33 exactly. On the nominal 10 mV step those are 10.4, 25.3 and 43.3 percent, which is the record's about 10, 25 and 43; against the 10.09 settled level they would be 9.4, 24.2 and 42.0, so the percentages are honest either way. The 30 deg trace does ring visibly - successive maxima 14.33, 10.87, 10.23, 10.11 mV. A white fill rect does exist on this page but it is the legend box at x greater than 348 and y greater than 288, nowhere near any peak. Every other citation re-read and exact: p2 fig 1-1 flat 120 ohm plus the electrical row R_O f = 1 MHz 120 ohm and the sentence limiting the analysis to amplifiers with a flat resistive output impedance; p4 fig 3-1 OPA392 buffer with C3 10u direct on the output, the Vout trace ringing across the full 0 to 1.00 ms axis, phase margin of less than 1 degree, and the ADC reference driver sentence; p5 eq 2 transcribed exactly, 380 mohm giving 60 degrees, and Always use Spice simulation tools such as TINA-TI to verify; p6 eq 3 with the 40 dB/decade rate of closure; p7 eq 4 and eq 5 with the 20 dB ROC restored; p8 fig 4-5 reading 4.99 V at 20 ohm and 4.90 V at 200 ohm into 10 kohm plus 5 nF from 5 V, plus the text that RISO is designed to be as small as tolerable and that a larger one costs voltage error and settling time; opa333 p7 Open-loop output impedance f = 350 kHz IO = 0 A 2 kohm and Gain-bandwidth product CL = 100 pF 350 kHz. p9 also supports the prose's optimally damped label - In certain cases, it is typical for a phase margin of 60 degrees to be considered optimally damped. The one inference in the record, that overshoot past 605 pF is worse than 40 percent, is a one-step monotone extrapolation off a trace that leaves the frame top still rising, and the record labels it unquantified rather than pretending to a number. Nothing here refutes."}
