id: precision-buffer-capacitive-load-isolation
classes: [feedback]
applies:
  topologies: [precision-buffer]
  packages: []
  interfaces: []
  parts: []
rule:
  enforced_by: null
  mechanism: "C_LOAD against open-loop R_O adds pole f_p2 = 1/(2*pi*R_O*C_LOAD); 40 dB/dec rate of closure = ringing"
  fix: "series R_ISO adds zero f_z1 = 1/(2*pi*R_ISO*C_LOAD), restoring 20 dB/dec"
  r_iso_optimal: "(1 + sqrt(1 + 8*pi*R_O*C_LOAD*f_gbw)) / (4*pi*C_LOAD*f_gbw)"
  phase_margin_target_deg: 60
  inputs_from_datasheet: "open-loop output impedance R_O and gain bandwidth f_gbw"
  cost: "R_ISO divides against any resistive load and lengthens settling - use the smallest stable value"
  verify: "simulate the loop; the equation is a starting point"
prose: >
  A unity-gain follower driving a capacitor is not automatically stable. The
  load capacitance works against the amplifier's OPEN-loop output impedance
  R_O - a datasheet spec, flat at 120 ohm for OPA392 (sboa418 p2 fig 1-1),
  2 kohm at 350 kHz for OPA333 (opa333 p7) - adding a pole
  f_p2 = 1/(2*pi*R_O*C_LOAD) to the loaded AOL curve. When f_p2 falls below
  the amplifier's bandwidth, AOL drops 40 dB/decade into 1/beta and the rate
  of closure doubles (p6 fig 4-2): p4 fig 3-1 shows an OPA392 buffer with
  10 uF direct on its output ringing ~1 ms at under 1 degree phase margin.
  A series isolation resistor adds a zero
  f_z1 = 1/(2*pi*R_ISO*C_LOAD) that cancels f_p2 and restores 20 dB/decade
  closure (p7 figs 4-3/4-4). The optimal value puts f_z1 at the closure
  frequency, phase margin 50-60 degrees:
  R_ISO = [1 + sqrt(1 + 8*pi*R_O*C_LOAD*f_gbw)]/(4*pi*C_LOAD*f_gbw) (p5 eq 2).
  R_ISO is not free - it divides against any resistive load (p8 fig 4-5:
  20 ohm loses 10 mV of 5 V into 10 kohm, 200 ohm loses 100 mV) and it
  lengthens settling - so take the smallest stable value; p9 fig 5-1 puts
  30 degrees at 14.33 mV on a 10 mV step (~43%) and 60 degrees, TI's
  optimally damped case, at 11.04 mV (~10%). The capacitance alone is
  measurable: OPA333 small-signal overshoot runs ~0% at 10 pF, ~10% at
  100 pF and ~25% at 300 pF, and the trace leaves the top of the 40% frame
  at ~605 pF - it is NOT drawn at 1 nF, where overshoot is worse than 40%
  and unquantified (opa333 p11 fig 15).
sources:
  - file: reference/knowledge/sources/sboa418.pdf
    page: 2
    section: "1 Introduction: Open-Loop Output Impedance (RO)"
    note: >
      Fig 1-1 plus the electrical-table row: OPA392 open-loop output impedance
      is flat at ~120 ohm across frequency and is published as a datasheet
      spec (120 ohm at 1 MHz); the analysis applies to amplifiers with a flat
      resistive R_O.
  - file: reference/knowledge/sources/sboa418.pdf
    page: 4
    section: "3 Example, Calculate Optimal Isolation Resistance"
    note: >
      Fig 3-1: OPA392 buffer with a 10 uF capacitor direct from output to
      ground; the transient plot shows sustained ringing over ~1 ms, phase
      margin confirmed under 1 degree. Text notes an ADC reference driver is
      a case where the load capacitor cannot be removed.
  - file: reference/knowledge/sources/sboa418.pdf
    page: 5
    section: "Equation 2 (optimal RISO)"
    note: >
      Fig 3-2: a 380 mohm R_ISO takes the same circuit to 60 degrees phase
      margin and a clean settle. Equation 2 gives R_ISO from f_gbw, R_O and
      C_LOAD; text says to verify the chosen value in SPICE.
  - file: reference/knowledge/sources/sboa418.pdf
    page: 6
    section: "4 RO, RISO, and Capacitive Load Drive"
    note: >
      Fig 4-1 output-resistance model and fig 4-2 Bode plot: C_LOAD with R_O
      creates f_p2 = 1/(2*pi*R_O*C_LOAD), the loaded AOL falls at 40 dB/dec
      and closes on 1/beta at 40 dB rate of closure - the instability.
  - file: reference/knowledge/sources/sboa418.pdf
    page: 7
    section: "Effects of RISO on open-loop gain"
    note: >
      Figs 4-3/4-4: R_ISO in series with C_LOAD creates zero
      f_z1 = 1/(2*pi*R_ISO*C_LOAD) and moves the pole to
      f_p2* = 1/(2*pi*[R_O+R_ISO]*C_LOAD), returning a 20 dB rate of closure.
  - file: reference/knowledge/sources/sboa418.pdf
    page: 8
    section: "RISO voltage error"
    note: >
      Fig 4-5: two identical buffers into 10 kohm || 5 nF from 5 V; 20 ohm
      R_ISO reads 4.99 V at the load, 200 ohm reads 4.90 V. Text - larger
      R_ISO buys phase margin at the cost of voltage error and settling time.
  - file: reference/knowledge/sources/sboa418.pdf
    page: 9
    section: "5 Derive Equation for Optimal Isolation Resistance"
    note: >
      Fig 5-1: small-signal step response at 75/60/45/30 degrees phase
      margin on a 10 mV step, read off the plot vertices and calibrated on
      the printed gridlines rather than by eye. Settled level 10.09 mV;
      peaks 10.09 mV at 75 deg (no overshoot), 11.04 mV at 60 deg (~10% of
      the step), 12.53 mV at 45 deg (~25%) and 14.33 mV at 30 deg (~43%,
      with visible ringing). Text: the optimal isolation resistance is the
      SMALLEST series resistance that produces an acceptable transient
      response; 45 deg is generally considered stable; placing f_z1 at the
      closure frequency targets 50-60 deg, and for a loaded buffer that
      closure frequency is below f_gbw.
  - file: reference/knowledge/sources/opa333.pdf
    page: 7
    section: "6.6 Electrical Characteristics"
    note: >
      Output block of the table: open-loop output impedance 2 kohm at
      f = 350 kHz, I_O = 0 A, and GBW 350 kHz specified at C_L = 100 pF - the
      two datasheet inputs the R_ISO equation needs, for a micropower part
      whose R_O is over an order of magnitude above the OPA392 example.
  - file: reference/knowledge/sources/opa333.pdf
    page: 11
    section: "6.7 Typical Characteristics, Figure 15"
    note: >
      Fig 15 small-signal overshoot vs load capacitance, extracted from the
      PDF vector geometry (the trace is two bezier segments; the log x-axis
      fitted to 19 printed gridlines, max residual 0.003 decade). The curve
      spans 10.4 pF to ~605 pF ONLY and terminates where it meets the 40%
      top of the frame: 0.05% at 10.4 pF, 9.8% at 100 pF, 24.5% at 300 pF,
      33.7% at 470 pF, 39.9% at ~605 pF. 7% falls at 69 pF and 15% at
      162 pF. THERE IS NO 1000 pF POINT - past ~605 pF the trace is off the
      chart and the overshoot is unquantified, worse than 40%. The same
      instability measured on a micropower CMOS follower over the lower half
      of the capacitance range a SAR charge bucket occupies.
