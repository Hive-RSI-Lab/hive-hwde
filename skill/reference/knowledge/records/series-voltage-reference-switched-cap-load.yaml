id: series-voltage-reference-switched-cap-load
classes: [decoupling]
applies:
  topologies: [series-voltage-reference]
  packages: []
  interfaces: []
  parts: []
rule:
  load_mechanism: "capacitor-DAC charge redistribution - one current spike per bit decision"
  peak_current_scales_with: "converter clock frequency; largest at the MSB, varies with input magnitude"
  charge_window: "the conversion, not the cycle - clocks 3 to 14 of a 0.5 us cycle at 64 MHz is about 0.19 us, the first half"
  error_kind: "nonlinear (distortion/INL), not a clean offset - the variation acts on the reference output impedance"
  bulk_cap_placement: "very near the ADC REF pin - it supplies the per-bit charge, the reference loop cannot"
  bulk_cap_constraint: "must also lie inside the reference's stable capacitance window"
  buffer_when: "current demand is high - e.g. one reference driving more than one converter"
  trace_budget: "Rtrace * Imax much less than LSB/2"
  enforced_by: null
prose: >
  A SAR converter is a switched-capacitor load on the reference. TI SNAA320B p10
  Fig 7-1 shows the mechanism: a binary-weighted array (C, C/2, C/4, C/8, C/16,
  C/16') whose switches connect each element to VIN or VREF, so every bit
  decision redistributes charge on the REF pin; the MSB moves the most and the
  LSB the least. p11 Fig 7-2 measures it on a 12-bit SAR (AD7049, 2 MHz sampling,
  64 MHz clock, REF3433-Q1, 10 uF at the REF pin, sensed across 500 ohm): a
  ~350-450 uA baseline carrying bursts to ~600 uA, one burst per conversion, over
  a plotted span of ~1.0 to 2.4 us - about three cycles, not one. The timing is
  in the text: each cycle is 0.5 us and the conversion runs clock 3 to clock 14,
  MSB to LSB, "the first half of one cycle", so ~0.19 us at 64 MHz. The charge
  demand lands inside a fraction of the period, which is why a local capacitor,
  not the reference loop, has to supply it.
  Peak current is proportional to the converter's clock frequency and varies with
  input magnitude, so the "reference current" is a nonlinear load: the variation
  works against the reference's output impedance and appears as distortion, not a
  fixed offset. Rules from p11 - a capacitor very near the ADC REF pin to supply
  the switching charge, chosen inside the reference's own stable-capacitance
  window; a low-noise buffer when current demand is high, e.g. one reference
  feeding several converters; and Rtrace times Imax much less than LSB/2, since
  it adds directly to load-regulation error.
sources:
  - file: reference/knowledge/sources/snaa320b.pdf
    page: 10
    note: "Sec 7 Dynamic Error + Fig 7-1 SAR ADC Sampling Architecture: binary cap DAC C..C/16' with switch SB selecting VIN or VREF; text - charge redistribution on every bit conversion, peak current proportional to converter clock frequency, MSB max charge, variation translates into non-linear error"
  - file: reference/knowledge/sources/snaa320b.pdf
    page: 11
    note: "Fig 7-2 measured REF current (12-bit AD7049, 2 MHz CS, 64 MHz clock, REF3433-Q1, 10 uF at REF pin, sensed across 500 ohm), read at 3.2x: ~350-450 uA baseline with bursts to ~600 uA, x-axis spanning ~1.0 to 2.4 us (about three cycles - the span is the plot window, NOT one conversion). Text on the same page: each conversion is 0.5 us and the data conversion runs 3rd to 14th clock, MSB to LSB, the first half of one cycle (~0.19 us at 64 MHz); max REF current 600 uA at 1 V input, varying with input magnitude. Rules - cap very near the ADC REF pin, reference stability considered when selecting it, low-noise buffer if current demand is high (more than one ADC), trace drop Rtrace*Imax much less than LSB/2"
  - file: reference/knowledge/sources/ref70.pdf
    page: 27
    note: "Fig 10-1 Basic Reference Connection: REF7025 with CIN at VIN and CL at OUTF drives the converter REFP0 pin directly (OPA2320s buffer the analog inputs, not the reference) - the reference-side network is CL at the part plus a short run to the REF pin"
status: active
