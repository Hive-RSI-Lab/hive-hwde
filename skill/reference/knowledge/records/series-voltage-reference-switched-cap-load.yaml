envelope:
  load_kind: {in: [switched-cap]}
maturity: approved
generalizes: [sar-adc-acquisition-charge-transfer]
envelope_note: >
  Bounded by the kind of load, which is the whole content of the rule: the
  per-bit charge kick, the bulk cap at the converter pin and the buffer question
  exist only because the load samples the reference onto a capacitor array. A
  resistive or steady load draws its current continuously, and then the
  reference's DC load regulation and the IR-drop rule cover it with no bulk
  capacitor sizing and no buffer decision.
verification: {by: "second-reader", date: "2026-08-16", note: "SNAA320B p11 re-read: the page states verbatim 'Time period for each conversion is 0.5us. The data conversion takes place from 3rd clock to 14th clock from MSB to LSB (which is first half of one cycle)'. Clocks 3 through 14 is 12 clocks; at 64 MHz that is 187.5 ns, so the new charge_window of ~0.19 us is arithmetically exact and 'the first half of one cycle' is the source's own wording, correctly attributed. Figure 7-2 rendered at 5.5x with the x-axis calibrated off its own 1u / 1.5u / 2u ticks (0.1 us minor divisions): the plot frame runs from 1.0 us to 2.5 us, i.e. exactly three 0.5 us cycles - so the span really is the plot window and not one conversion, and the earlier '~1.3 us conversion window' error is cured. The trace wanders on a ~330-450 uA baseline with bursts to ~600-620 uA, matching the page text 'Max current taken by reference pin SAR ADC during conversion is 600uA for 1V input. This current varies with input magnitude.' p10 Fig 7-1 confirmed: capacitor DAC C, C/2, C/4, C/8, C/16, C/16' with switches S1 to S5' plus SA and SB and both VIN and VREF present, under Sec 7 text on charge redistribution at every bit conversion, peak current proportional to the converter clock frequency, MSB requiring maximum charge and 'This variation gets translated into non-linear error'. The p11 design rules are verbatim (a capacitor very near the ADC reference pin, reference stability considered when selecting it, a low-noise buffer if one reference drives more than one ADC, and Rtrace x Imax much less than LSB/2 because it adds directly to load-regulation error). REF70 p27 Fig 10-1 shows REF7025 with CIN and CL driving the ADS124S08 REFP0 pin directly, with the OPA2320s on the analog inputs only. No bulk-cap sizing formula is invented anywhere in the record. Minor, non-refuting: the plot's right frame is 2.5 us, not the '~2.4 us' the prose and the p11 note give; the accompanying 'about three cycles' is exactly right."}
