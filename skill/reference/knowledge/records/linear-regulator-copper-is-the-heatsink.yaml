verification: {by: "second-reader", date: "2026-08-16", note: "Delta pass on the post-verification edit (file mtime 19:33 vs verdict 19:27). The new material is one prose clause plus one citation, and both hold. LM1117 p14 reopened visually: section 9 Application and Implementation opens with the boxed Note read verbatim - Information in the following applications sections is not part of the TI component specification, and TI does not warrant its accuracy or completeness. TI customers are responsible for determining suitability of components for their purposes, as well as validating and testing their design implementation to confirm system functionality. The record quotes the load-bearing fragment exactly. The scope claim is right too: 9.5.1.1 Heat Sink Requirements is a subsection of section 9 (starts p17, runs onto p18), so the eq 2-5 sizing chain this record prescribes does inherit the disclaimer, and the citation note states it in those terms. I also reopened LM1117 p18 this pass for the sibling thermal record and it still carries what this record cites: eq 2 IIN = IL + IG, eq 3 PD = (VIN-VOUT)IL + VIN IG with Fig 9-10 Power Dissipation Diagram, eq 4 TR(max) = TJ(max)-TA(max), eq 5 RthJA = TR(max)/PD, and As a design aid, Table 9-2 shows the value of the theta_JA of SOT-223 and TO-252 for different heat sink area, with the page naming AN1028 for power enhancement techniques - which is also why the AN-1028 material this record carries is fairly attached. The AN-1028 p3/p4/p8 citations were not re-opened this pass (unchanged since the standing verdict, which read them page by page). Level principle with rule null and no envelope remains correct: the record prescribes a sizing method and no number, and the added clause only weakens its own authority, which is the safe direction."}
