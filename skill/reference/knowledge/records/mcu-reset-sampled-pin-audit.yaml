verification: {by: "second-reader", date: "2026-08-16", note: "Re-read DS p27/p32 + AN13033 p15/p10. p27 Table 10 legend is verbatim as quoted: pin type I = input only pin; I/O structure B = dedicated BOOT0 pin; RST = bidirectional reset pin with embedded weak pull-up resistor; and the Notes row - unless otherwise specified by a note, all I/Os are set as floating inputs during and after reset. p32 shows the same table answering the audit both ways: the BOOT0 row carries no note while note 7 explicitly activates the PA13/PA14 internal pull-up and pull-down. AN13033 p15 Table 12 gives RESET default state Input, pull-up and all PIOn_m (not open-drain) Input, pull-up; p10 Table 8 confirms the state of PIO0_5 at reset determines the boot source. The record states the audit as a method and imports no ST polarity mapping. Principle with no envelope is right - a method carries no operating-point bound."}
