    max: 1000000
maturity: verified
generalizes: []
envelope_note: >-
  The leakage error is the parasitic current times the impedance of the node it lands on,
  so node impedance decides which technique governs. The 1 Mohm bound is the author's engineering
  split, not a vendor figure: below it (bridge, thermocouple, strain-gauge sources at hundreds
  of ohms) symmetry of the two paths is the technique argued; at and above it an actively
  driven guard is what the vendor prescribes. Humidity moves the parasitic three decades,
  so this is a design-condition bound.
verification:
  by: second-reader
  date: '2026-10-04'
  note: >-
    Second read 2026-10-04 against 01258b p12, p13, p14 (searched for the both-surfaces and
    jumper text) and ina333 p16. Held: RP about 1000 Gohm dry / 1 Gohm humid, the guard rules,
    the 1000x figure. Edits: added a p14 source (Guard Rings on Both PCB Surfaces) for the
    both-surfaces and jumper rules and removed those claims from the p13 note; deleted the
    claim that a humid-board 1 Gohm parasitic gives sub-microvolt errors (3.3 nA x 350 ohm
    is about 1.2 uV) and the prose 'far below a microvolt'; the 1 Mohm bound is now stated
    as the author's engineering split; 1000x is stated as the vendor's worked example, 'typically';
    the symmetry regime and the in-amp application are labelled author inference.
