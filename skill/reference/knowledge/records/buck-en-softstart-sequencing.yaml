approval:
  by: perms
  date: "2026-10-04"
  note: >
    Principle, no envelope: read the enable pin's OWN behaviour before
    adding parts, keep UVLO hysteresis wider than the source droop it must
    ride out, and remember soft-start sets the inrush the source sees. True
    of any enable/UVLO input on any part; nothing here varies with the
    buck's operating point. Re-approved 2026-10-04 by perms on the owner's
    standing redirect (#ai-ee 1791102051.529859), U22 Q1, not the owner's own
    ruling: bb-buck's buck-precision-en-fixed-softstart folded in (do-not-
    float EN, fixed soft-start inrush, hysteresis as a fraction of turn-on),
    six LMR33630 sources added; still a principle. First approved by the
    owner 2026-08-15.
