maturity: approved
approval:
  by: owner
  date: "2026-08-15"
  note: >
    Bounded by the rectifier, not the operating point: the record IS the
    free-wheel diode's placement + snubber rules (ROHM fig 3-e..3-h). A
    synchronous buck has no D1, so the record does not apply there - its
    surviving core (tight LS return corner) is the principle parent.
generalizes: [buck-input-hot-loop]
