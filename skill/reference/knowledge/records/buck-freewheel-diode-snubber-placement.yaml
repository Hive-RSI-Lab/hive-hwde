id: buck-freewheel-diode-snubber-placement
classes: [power-loop, emi]
applies:
  topologies: [buck]
  packages: []
  interfaces: []
rule:
  enforced_by: null
  diode_surface: same layer as IC terminals, never via-dropped to bottom
  snubber_at: IC SW + GND terminals, NOT across the diode ends
prose: >
  Async buck (free-wheel diode) placement rules: the diode must sit CLOSE
  and on the SAME surface as the IC terminals, wired short and wide,
  connected directly to the IC's GND and SW terminals - distance adds
  wiring inductance whose spike noise piles onto the output, and dropping
  the diode to the bottom layer through vias makes it worse (via
  inductance). If spike noise still needs an RC snubber, place it CLOSE TO
  THE IC's SW and GND terminals; a snubber across the diode's own ends
  does NOT absorb the spike generated by the wiring inductance (ROHM
  fig 3-g vs 3-h). Sync bucks lose the diode but keep the rule's core: the
  LS-FET return corner of the hot loop stays tight to the IC.
sources:
  - {file: reference/knowledge/sources/rohm-buck-pcb-layout-an.pdf, page: 3, section: "s3, fig 3-e..3-h"}
  - {file: reference/knowledge/sources/rohm-buck-pcb-layout-an.pdf, page: 5, section: fig 3-g/3-h placement}
status: active
origin: app-note:rohm-buck-pcb-layout-an (ROHM 60AN066E Rev.004, 2024-01)

# --- schema v2 governance (U14 backfill, owner-ruled 2026-08-15) ---
level: topology
envelope:
