  iout_a: {max: 10}
maturity: approved
approval:
  by: owner
  date: "2026-08-15"
  note: >
    Scales with the V/I corner, because that is exactly what picks the rung:
    integrated sync at <= ~60 V / <= ~3 A, async + Schottky where the corner
    has no stocked sync part, controller + FETs above that. Past ~100 V in
    or ~10 A the honest options (isolated topologies, multiphase) are not on
    this ladder at all.
