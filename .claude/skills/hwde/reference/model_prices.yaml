# model_prices.yaml - USD per million tokens, for gen_cost.py.
#
# gen_cost.py prices every model message in a run's Claude Code transcripts
# with this table, so a board's generation cost can be split by hwde step.
#
# Source: fitted on 2026-09-24 to the `cost-state` records Claude Code itself
# writes at the end of each session transcript (totalCostUSD per model). With
# these rates the per-message token counts reproduce every recorded session
# total for these models to within $0.001 (17 Opus 5.5 and 7 Sonnet 5 sessions
# of this repo's tracks). Fable 5.1 was fitted the same way on 2026-10-14:
# its rates reproduce 330 recorded session totals (sessions from every repo
# on the box) to within $0.001, and they equal its published list price. The
# `[1m]` context variant is billed at the same rates. Haiku 4.5 is the
# published list price; it only appears in tiny title calls. A model not
# listed here is reported as unpriced tokens, never given a guessed price.
#
# Columns: input, output, cache_read, cache_write_5m, cache_write_1h.
# When a price changes, update the rates, the source and the verified date;
# a board's reports/cost.json keeps the figures it was priced with.

meta:
  currency: USD
  unit: per million tokens
  source: >-
    fitted to Claude Code cost-state session totals, 2026-09-24
    (Fable 5.1: 2026-10-14, equal to its list price)
  verified: "2026-10-14"

models:
  claude-fable-5-1:
    input: 10.0
    output: 50.0
    cache_read: 0.25
    cache_write_5m: 12.5
    cache_write_1h: 20.0
  claude-opus-5-5:
    input: 4.0
    output: 20.0
    cache_read: 0.2
    cache_write_5m: 5.0
    cache_write_1h: 8.0
  claude-sonnet-5:
    input: 2.0
    output: 10.0
    cache_read: 0.2
    cache_write_5m: 2.5
    cache_write_1h: 4.0
  claude-haiku-4-5-20251001:
    input: 1.0
    output: 5.0
    cache_read: 0.1
    cache_write_5m: 1.25
    cache_write_1h: 2.0
