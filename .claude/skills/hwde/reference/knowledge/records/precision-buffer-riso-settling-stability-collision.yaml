level: topology
envelope:
  load_kind: {in: [switched-cap]}
  topology_kind: {in: [unity-follower]}
maturity: approved
generalizes: [precision-buffer-settles-not-bandwidth]
envelope_note: >
  Both bounds must land on the SAME resistor. load_kind switched-cap puts them
  there: the ceiling t_ACQ/(12*C_FLT) exists only because an unbuffered SAR
  forces a charge bucket, and sprpeo2 p26 says a buffered ADC needs none -
  then that resistor carries stability alone and the test cannot fire.
  topology_kind unity-follower bounds the closed form: sboa418 p9 puts the
  optimum zero at the closure frequency, which equals f_gbw only for a buffer.
  Caveat: eq 2 wants a flat resistive R_O (sboa418 p2); OPA333 gives R_O only
  at 350 kHz. These numbers are one operating point - re-evaluate per block.
verification: {by: "research-second-reader", date: "2026-08-16", note: "Re-read sboa418 p2, p5, p9 and p11, sprpeo2 p26 and p27, and opa333 p7 and p11, re-derived every number from the raw formulas rather than accepting them, and re-measured fig 15 out of the vector geometry with an independent raster cross-check. Both things that were refuted last pass are fixed and nothing new breaks. ALGEBRA, all re-derived independently: ceilings t_ACQ/(12*C) with t_ACQ = 9 us give 750.00 ohm at 1 nF and 1595.74 ohm at 470 pF; eq 2 with R_O = 2 kohm and f_gbw = 350 kHz gives 1207.75 ohm and 1956.52 ohm; ratios 62.1 and 81.6 percent, the record's 62 and 82; the crossover where t/(12C) meets eq 2 reduces to sqrt(1 + 8*pi*R_O*C*f) = pi*f*t/3 - 1 and solves to 243.50 pF; the same equality solved for f at C = 1 nF gives 778.09 kHz, the record's 778.1 kHz and about 0.8 MHz; and 20*48 pF = 960 pF, so the crossover really does sit under the C floor. The 48 pF is a block input rather than a claim about a cited page, and it is factual - the ADS8326 datasheet in this workspace states the 48 pF sampling capacitance on p7 and p21. THE TWO NEW CITATIONS CARRY THE WORDS CLAIMED. sboa418 p9 reads verbatim: the optimal isolation resistance is the smallest series resistance that produces an acceptable transient response when driving the capacitive load; While a phase margin of 45 degrees is generally considered stable, this may not be sufficient for applications that demand low overshoot; In certain cases, it is typical for a phase margin of 60 degrees to be considered optimally damped; If voltage error is of primary concern, a phase margin of 45 degrees can be targeted as this allows the smallest isolation resistance to be used; and Selecting an RISO resistance that places fz1 exactly at the closure frequency, targets a phase margin between 50-60 degrees. The same page also carries the buffer caveat the envelope_note leans on - For a typical amplifier in a buffer configuration, the closure frequency is simply the gain bandwidth of the op amp - together with the qualifier that for a loaded AOL the closure frequency is always less than the gain bandwidth, which the record's own p9 note states. sboa418 p11 reads verbatim: Equation 13 can be used to quickly derive the isolation resistance required to target 50-60 degrees of phase margin. Spice simulation tools such as TINA-TI must be used to verify the resultant phase margin, as this can vary considerable depending on the initial phase margin and other circuit conditions - the sic on considerable is the document's own typo. Eq 13 on that page is eq 2 restated and eq 14 is the gain-stage variant; a scan of all 14 pages for 45 finds it only in p3 prose (45 degrees is a common benchmark, designers commonly target a minimum of 45) and in p9 prose and the fig 5-1 legend, so the record's claim that the document publishes NO closed form for the 45-degree R is exact. THE REWRITTEN TEST NOW STOPS WHERE THE SOURCES STOP. rule.test is a screen that fires a phase-margin check at the ceiling R; eq2_is_not_a_maximum is p9 in p9's own words; reject_when defers BOTH of its conditions - the 45-degree R and the ringing inside the accuracy window - to simulation, which is precisely what sboa418 p11 (Spice must be used) and sprpeo2 p27 (confirming RC combination plus driver in simulation recommended) demand. No part is rejected on unsimulated algebra any more, and the 470 pF case that made the old wording unsupportable at 82 percent of the optimum is now handled by the same screen rather than a verdict. SETTLING SIDE re-read: sprpeo2 p27 carries Pick C_FLT >= 20*C_SH >= 20*18pF >= 360pF with 470pF standard value, Practical t_FLT_settle = t_ACQ = 12*tau_FLT, R_FLT = t_ACQ/(12*C_FLT) approximately 12 ohm, Minimum driver GBW > 4*(1/(2*pi*R_FLT*C_FLT)), and the footnote about simulation, all on one slide - so the floor and the ceiling really do share a page. Its 12 ohm against 470 pF back-solves to 68 ns, consistent with the 70 ns acquisition on p25. p26 carries the limitation box ending For buffered ADCs charge bucket not needed, which is what bounds the envelope to load_kind switched-cap. opa333 p7 confirms Open-loop output impedance f = 350 kHz IO = 0 A 2 kohm and Gain-bandwidth product CL = 100 pF 350 kHz, both typicals. FIG 15 NOTE now matches the figure. Measured from the two cubic beziers against 19 gridlines fitted to 0.0034 decade and cross-checked by an 864-dpi raster scan that agrees within 0.1 percentage point: span 10.4 to 607 pF only, terminating on the 40 percent frame top, 9.74 percent at 100 pF, 24.48 at 300 pF, 33.68 at 470 pF, and zero curve pixels beyond 609 pF, so there is genuinely no 1000 pF reading. No white overpaint rect overlaps that frame - only the frame and the curve do. One synthesis this record makes and neither document states outright: that R_FLT and R_ISO are the same physical resistor. They occupy the same topological position (amplifier output to the shunt C), the envelope_note explains why an unbuffered SAR puts them there, and naming that collision is the record's whole purpose, so it is disclosed rather than smuggled. Verified."}
