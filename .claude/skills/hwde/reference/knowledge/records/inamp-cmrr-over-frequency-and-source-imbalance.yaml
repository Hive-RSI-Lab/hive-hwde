envelope:
  f_signal_hz: {min: 0, max: 100000}
maturity: approved
generalizes: []
envelope_note: >
  Scales with FREQUENCY. The bound is a DATA limit, not a mechanism limit:
  Figures 27 and 28 are both plotted 0.1 Hz to 100 kHz, so 100 kHz is where
  the vendor's measurement stops, not where the physics does. min is 0
  because Figure 28's imbalance is resistive and costs 15-36 dB at LOW
  frequency too - the rule does not switch on partway up the band. Above
  100 kHz the failure becomes RF rectification, a separate data sheet
  section with its own remedy, so this record hands off there. The bound is
  NOT 5 kHz: that is only where Table 3's rows stop, and this chain runs to
  f3db = 41 kHz.
verification: {by: "research-second-reader", date: "2026-08-16", note: "RE-RULED after repair; re-measured independently, did not take the researcher's numbers on trust. BOTH CORRECTIONS CONFIRMED. (1) 1 kHz penalty: my reads are Fig27 109.43/109.43/110.57 dB and Fig28 92.40/93.47/94.30 dB at G=10/100/1000, so the true penalties are 17.0/16.0/16.3 dB; the record's 17.1/15.9/16.3 is right to 0.1 dB and its two new raw-read keys subtract exactly (109.4-92.3=17.1, 109.2-93.3=15.9, 110.6-94.3=16.3). The self-inconsistent '20 to 27' range is gone. (2) Fig27 100 kHz ends: measured 55.8/67.8/83.9/104.7 dB, so 56/68/84/105 is right within 0.3 dB - note the 85 also moved to 84, which the coordinator's account said was untouched; the change is an improvement, not a regression. NEW PAGE-4 CITATION IS EXACT: PDF p.4 is printed Page 3 of 28, header reads '+VS = +15 V, -VS = -15 V, VREF = 0 V, TA = 25 degC, G = 1, RL = 10 kOhm, specifications referred to input, unless otherwise noted' - quoted verbatim; Table 2 CMRR block (VCM = -10 V to +10 V) prints ARZ/ARMZ minimums 86/106/120/120 dB DC to 60 Hz and 80/90/90/100 dB at 5 kHz, identical to Table 3 for BOTH grades, and its CMRR rows also stop at 5 kHz. The reworded p.10 note is more accurate, not merely softened: the original 'must NOT be compared against Table 3' implied no comparison was possible, when the data sheet in fact guarantees the same CMRR minimums at 2.7 V and at +/-15 V and prints a matching-condition table; every figure value in the record still carries the +/-15 V condition, and no statement claims the absolute +/-15 V dB transfers to this 3.3 V board. OCCLUSION DISCLOSURE IS LEGITIMATE AND THE POINT IS RECOVERABLE: at 1 kHz the G=10 and G=100 curves are coincident to 0.00 dB (both 109.43), so a raster read genuinely cannot separate them and bracketing is the right move; the asserted 109.4 is correct to 0.03 dB. Two audit-trail looseness items to note, neither refuting: the disclosed bracket endpoints read 109.9 at 878 Hz and 107.9 at 1289 Hz where the curve is 110.5 and 107.3 (each 0.6 dB off, inside the record's declared +/-1 dB), and a straight chord between the DISCLOSED endpoints gives 109.2, not the asserted 109.4 - the asserted value is nonetheless the true one. Same occlusion explains the 5 kHz G=10 read (record 94.4, true 95.05, inside +/-1 dB); 'typ sits 4 to 5 dB over min' is really 3.8 to 5.3 dB. NOTHING ELSE MOVED: envelope {min 0, max 100000} and envelope_note are byte-identical to the version I verified; Fig28 plateaus 96/102/106/108 and ends 55/55/68/88, LF penalties 0/15/27, the 20 dB/decade and plateau-end claims, the BANDWIDTH LIMITED note, the scope key and the p.6 and p.22 source notes are all unchanged and all still check out against the pages. Residual nits for a later pass, not defects: envelope_note still says 'costs 15-36 dB at LOW frequency' where the measured maximum is 34.8 dB (G=1000) - 1.2 dB over the record's own new +/-1 dB tolerance; envelope_note still attributes the 5 kHz ceiling to Table 3 alone although the record now knows Table 2 stops there too; and 'spans about 48 dB' measures 46.9 dB (it does equal the rounded ladder 144-96)."}
