verification: {by: "second-reader", date: "2026-08-15", note: "Re-read lmr33630 p7, p25 and p33, plus snva721a p5 and p6. p7 and p25 support the thermal-entry demand exactly: the 42.9 C/W is captioned only valid for comparison with other packages and can not be used for design purposes; 9.2.2.11 names power dissipation, PCB area, copper heat-sink area, the number of thermal vias under the package and adjacent component placement as the effective RthetaJA drivers; Figure 9-3 is captioned as per-layer copper area on a four-layer board with 2 oz outers and 1 oz inners; and Equation 11 turns RthetaJA and ambient into the maximum output current, which is what a thermal entry really asserts. p33 rules 1, 2, 3, 4, 6 and 9 are precisely the placement groups and route facts claimed, snva721a p5 Figure 8 is the separate gate-drive group, and snva721a p6 Figures 11 and 14 give the 33.5 versus 34 dBuV/m cut-under-SW result behind emitting plane continuity as an explicit route constraint. On the level question: this record governs the SHAPE of what a buck block hands downstream, and none of the P2 dimensions bounds emit a copper-area target with the stack, emit more than one placement group, emit continuity as a route fact, or the pad via array travels with the land pattern. The gap asks constraints-emission at min_level principle and the record meets it without inventing a filler dimension. The CBOOT/CVCC group list is integrated-fet flavoured, but the emitted rule (do not collapse layout guidance into the hot loop alone) is general, so no envelope is owed."}
