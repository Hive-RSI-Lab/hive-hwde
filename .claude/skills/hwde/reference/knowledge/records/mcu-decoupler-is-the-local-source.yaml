verification: {by: "second-reader", date: "2026-08-16", note: "Re-read AN2519 p5/p6, AN13033 p6, DS p41. AN2519 p5 carries verbatim: Such a current spike cannot be delivered over long power supply lines; the main source is (or should be) the decoupling capacitor - plus the several-hundred-mA and few-nanosecond figures, and Fig 2-1 Incorrect Decoupling whose High Current Loop runs through the power and ground planes, with the text stating the whole ground plane will act as an antenna instead of only the high-current loop. p6 Fig 2-2 shows the cap moved against the MCU VCC/GND pins with the ferrite upstream. AN13033 p6 Fig 3 side view shows the local current loop closing through a via to the GND plane and a via to the VDD plane. DS p41 Caution is verbatim. One locator slip found, not enough to break the record: of the two s3.2 bullets the note pins to p6, only the route-distance-to-the-power-plane bullet is on p6; the ground-side-via bullet is the last line of p5, same section, same ledger file. Principle with no envelope is correct - this is the loop physics, nothing bounds it."}
