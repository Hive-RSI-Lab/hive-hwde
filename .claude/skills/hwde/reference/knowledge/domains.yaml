# domains.yaml - the research fetch allowlist (U15, v3 design decision 5a).
#
# Researcher agents are the ONLY agents with web access, and `research.py
# fetch` is the ONLY sanctioned way a downloaded document enters a workspace
# (quarantined under <ws>/research/sources/, sha-pinned in the task ledger).
# A URL whose host is not covered here is REFUSED (exit 2) - before any
# network call, and again on every redirect hop. Design/fixer agents stay
# locked down: they receive researched knowledge through the same
# `knowledge.py --select` injection every stage gets, never a URL.
#
# Matching: https only; the host must EQUAL a listed domain or end in
# `.<domain>` (`www.ti.com`, `e2e.ti.com` match `ti.com`; `notti.com` does
# not). `forum_hosts` are subdomains of allowed vendors that host community
# answers - a fetch from one is FORCED to tier `forum` (never sole-source)
# whatever the researcher declared.
#
# Source tiers (declared per fetch, `--tier`), best first:
#   vendor-layout   the subject part's OWN datasheet layout section / eval
#                   board / reference layout - the vendor knows its part
#   vendor-appnote  the same vendor's application note on the topology
#   cross-vendor    another vendor's app note on the same topology/interface
#   forum           community answers - corroboration ONLY, never the sole
#                   source of a record
# The tier is a fact about the DOCUMENT vs the SUBJECT part, not about the
# host: a TI app note is vendor-appnote for a TI part and cross-vendor for an
# MPS part - which is why the researcher declares it and the ledger keeps it.
#
# Growing the list: add the vendor when a real gap needs it (same posture as
# knowledgelib.CLASSES); kind is one of vendor | distributor | standards |
# forum. Keep it ASCII; keep one domain per line.

version: 1

