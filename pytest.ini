[pytest]
testpaths = tests
addopts = -q -rfEX -p no:cacheprovider
markers =
    smoke: live-toolchain smoke tests (need KiCad installed; slower)
    slow: a few seconds or more each (live toolchain, whole fixture boards); listed in tests/conftest.py SLOW, left out of bin/hwde test, run by bin/hwde test-slow
    em: a long full-wave solve; listed in tests/conftest.py EM, also slow, left out of bin/hwde test and test-slow, run by bin/hwde test-em
    net: live-network tests (hit the JLCPCB/EasyEDA APIs; need internet)
    kicad_recorded: asserts numbers recorded on the KiCad pin (RECORDED_KICAD, tests/conftest.py); skipped and named in the summary on any other kicad-cli
    host_models: needs KiCad's stock 3D models; every other test resolves ${KICAD<n>_3DMODEL_DIR} to tests/fixtures/3dmodels (tests/conftest.py)
