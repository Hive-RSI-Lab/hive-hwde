# Seeded fault for check_ratings' rating_listing_disagrees (hive-hwde #799).
mutants:
  listing-disagrees-with-datasheet:
    board: blinky2
    script: mutations/listing_disagrees_with_datasheet.py
    check: check_ratings
    defect: >-
      SIDECAR fault (+ an LCSC property on D1 so the parts dir finds it):
      parts/parts.json lists D1's reverse voltage as 50 V and its extraction
      reads 25 V from the datasheet, so the listing overstates what the part
      holds off. D1's rail is low enough that no rail check notices.
    expect:
      kind: rating_listing_disagrees
      ref: D1
