# Seeded fault for check_stackup (copper no fab builds, issue #728).
mutants:
  stackup-copper-core-thick:
    board: blinky2
    script: mutations/stackup_copper_core_thick.py
    check: check_stackup
    defect: >-
      Stackup fault: the core's 1.524 mm also written into B.Cu (43.5 oz), as
      rf-kit-ro4350b's generator did. KiCad's DRC doesn't read the stack
    expect:
      kind: copper_thickness_range
  stackup-thickness-general:
    board: blinky2
    script: mutations/stackup_thickness_general.py
    check: check_stackup
    defect: >-
      Stackup fault: sane copper on a 4.5 mm core, so the layers sum to
      4.57 mm against the board's general thickness (rf-kit-ro4350b: 4.617
      against 1.6). KiCad's DRC doesn't read the stack
    expect:
      kind: thickness_stack_vs_general
  stackup-mask-thick:
    board: blinky2
    script: mutations/stackup_mask_thick.py
    check: check_stackup
    defect: >-
      Stackup fault: the laminate's 1.524 mm written into the solder mask
      layer, as rf-kit-ro4350b's generator did. KiCad's DRC doesn't read the stack
    expect:
      kind: mask_thickness_range
