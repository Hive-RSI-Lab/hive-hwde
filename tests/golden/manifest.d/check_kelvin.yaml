# Seeded fault for check_kelvin (hc-power cold review 2, R2).
mutants:
  kelvin-tap-past-neck:
    board: blinky2
    script: mutations/kelvin_tap_past_neck.py
    check: check_kelvin
    defect: >-
      MEASUREMENT fault: a current-sense amplifier's tap joins at the inductor's pad,
      past 6 mm of 0.5 mm track from a 10 mOhm shunt, so it reads the copper as
      shunt. Nets connect and widths are legal, so nothing else sees it
    expect:
      kind: kelvin_error
      refs: [R901, U901]
  sense-tap-teed-off-rail:
    board: blinky2
    script: mutations/sense_tap_teed_off_rail.py
    check: check_kelvin
    defect: >-
      MEASUREMENT fault: a feedback divider's sense line, declared in sense_pads to
      read the output capacitor's pad, tees into the rail's power track 7 mm short of
      it, so the regulator holds the rail there. Nets connect and widths are legal,
      so nothing else sees it
    expect:
      kind: sense_tap_off_pad
      refs: [C911, R911]
