# Seeded faults for check_ratings' rating_no_attributes (hive-hwde #675, #751, #763, #797).
mutants:
  diode-no-attributes:
    board: blinky2
    script: mutations/diode_no_attributes.py
    check: check_ratings
    defect: >-
      SIDECAR fault (+ an LCSC property on D1 so the parts dir finds it):
      parts/parts.json lists D1's code with an empty attributes, so nothing
      rates the diode and verify must fail rather than warn
    expect:
      kind: rating_no_attributes
      ref: D1
  coded-ldo-no-attributes:
    board: blinky2
    script: mutations/coded_ldo_no_attributes.py
    check: check_ratings
    defect: >-
      SIDECAR fault (+ an LCSC property on U2 so the parts dir finds it):
      parts/parts.json lists U2 as XC6206P332MR-G with empty attributes, and
      only the family's MPN code says it is a regulator
    expect:
      kind: rating_no_attributes
      ref: U2
  bare-buck-no-attributes:
    board: blinky2
    script: mutations/bare_buck_no_attributes.py
    check: check_ratings
    defect: >-
      SIDECAR fault (+ an LCSC property on U2 so the parts dir finds it):
      parts/parts.json lists U2 as TPS54560BDDAR with empty attributes, and
      only the buck's family says it is a regulator
    expect:
      kind: rating_no_attributes
      ref: U2
  bare-power-ic-no-attributes:
    board: blinky2
    script: mutations/bare_power_ic_no_attributes.py
    check: check_ratings
    defect: >-
      SIDECAR fault (+ an LCSC property on U2 so the parts dir finds it):
      parts/parts.json lists U2 as TPS60403DBVR with empty attributes, and
      only the charge pump's family says it is a rated power IC
    expect:
      kind: rating_no_attributes
      ref: U2
