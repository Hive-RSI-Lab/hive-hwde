# Seeded fault for check_connector_fit (docs/failure-modes.md section 4).
mutants:
  post-holes-missing:
    board: blinky2
    script: mutations/post_holes_missing.py
    check: check_connector_fit
    defect: >-
      J2's drawing (parts/C9900001.json mechanical.posts) has two 1.0 mm
      locating posts and its footprint has no hole for them, so the posts
      stand on the board (hifi-receiver-2 review DFM-1, core's RCA jacks)
    expect:
      kind: post_holes_missing
      ref: J2
      pos: [146.5, 110.5]   # J2's origin
  solder-wire-hole-loose:
    board: blinky2
    script: mutations/solder_wire_hole_loose.py
    check: check_connector_fit
    defect: >-
      J1 is a SolderWire footprint with 2.0 mm holes and a GND pad joined to
      the pours by 0.2 mm thermal spokes: the copper feeding it carries
      about 3.4 A, a 0.75 mm^2 wire, whose 1.25 mm conductor leaves the
      joint loose (oasis v0.2 errata, J1's 3.0 mm holes, issue #881)
    expect:
      kind: tht_hole_loose
      ref: J1
      pos: [102.8, 103.5]   # J1's origin
