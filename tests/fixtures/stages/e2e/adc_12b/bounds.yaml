# HIDDEN: never shown to the agent that designs the board (reference/e2e-scoring.md)
brief: e2e_adc_12b
nets:
  - {id: ain, pattern: "(?i)AIN|ANALOG|VIN"}
  - {id: vdd, pattern: "(?i)^/?\\+?3V3$"}
  - {id: gnd, pattern: "^GND$"}
  - {id: sclk, pattern: "(?i)SCLK|SCK"}
  - {id: data, pattern: "(?i)MISO|DOUT|SDO|SDA"}
  - {id: cs, pattern: "(?i)(^|/)~?\\{?(N?CS|SS)"}
# the attenuator ratio depends on the converter and reference chosen: no SPICE
layout: {area_mm2_max: 1500, crossings_signal_max: 2, decap_worst_mm_max: 4}
cost: {qty: 10, target_usd: 6.00}
