# Machine-readable twin of docs/failure-modes.md. Same ids. Edit both together.
schema_version: 1
categories:
  MECH: Mechanical, enclosure, connector, mounting
  THERM: Thermal
  RATE: Electrical ratings and part values
  PI: Power integrity
  PROT: Protection
  EMC: ESD and EMC
  SI: Signal integrity
  ANA: Analog and grounding
  FAB: Fab DFM
  DFA: Assembly, CPL, BOM, sourcing
  TEST: Test and bring-up access
  FW: Firmware-hardware interface
  SAFE: Safety and compliance
  CONC: Conceptual and requirements
modes:
- id: MECH-01
  category: MECH
  mode: Connector mouth faces into the board
  shows: board cannot be plugged in; passes place/DRC/verify/DFM
  catch: mating direction table per family; check mouth vs nearest edge
  coverage:
    script: check_mating
    rule: mating_faces_inward
    level: L2
  target_level: L3
  gap: placement does not pick orientation from the family table (T#70); still per-board fixes
  hit_on:
  - PCB-0021-A
  - PCB-0018-A
  - pd-trigger
  - bb-adc
  - usb-111FD
  sources:
  - T#70
  - L677
  - L731
  - B:PCB-0021-A
- id: MECH-02
  category: MECH
  mode: Connector mouth recessed behind board edge
