name: smoke
# bin/hwde test-smoke: whole flows on a live KiCad, which ci.yml's per-PR suite leaves out.
# Every PR, about 10 min here, and daily for what changes without a PR (the tool pins'
# downloads, the runner). A scheduled failure opens an issue, or adds to the open one:
# nobody reads a scheduled run's result otherwise (#769).
on:
  schedule:
    - cron: "17 6 * * *"
  pull_request:
  workflow_dispatch:
concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  issues: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HIVE_TOOLS: ${{ github.workspace }}/../tools
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/hwde-tools
      - name: the smoke tests (bin/hwde test-smoke)
        shell: bash
        run: bin/hwde test-smoke -rs 2>&1 | tee "$RUNNER_TEMP/smoke.log"
        env:
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@localhost
          GIT_COMMITTER_NAME: ci
          GIT_COMMITTER_EMAIL: ci@localhost
      - name: report a scheduled failure as an issue
        if: failure() && github.event_name == 'schedule'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="$RUNNER_TEMP/body.md"
          { echo "Scheduled smoke failed on main: $RUN"; echo; echo '```'
            grep -E '^(FAILED|ERROR) ' "$RUNNER_TEMP/smoke.log" | cut -c1-300 | head -40 || true
            echo '```'; } > "$body"
          open=$(gh issue list -R "$REPO" --state open --search 'in:title "Scheduled smoke failed"' --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then gh issue comment "$open" -R "$REPO" -F "$body"
          else gh issue create -R "$REPO" --title "Scheduled smoke failed on main" -F "$body"; fi
